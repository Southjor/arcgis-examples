<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>第49课：场景组件1 - Legend / ScaleBar / Compass / Zoom</title>
    <link rel="stylesheet" href="https://js.arcgis.com/5.0/esri/themes/light/main.css">
    <script type="module" src="https://js.arcgis.com/5.0/"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: "Microsoft YaHei", sans-serif; }
        #sceneView { width: 100vw; height: 100vh; }
        .page-title {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(255,255,255,0.95); padding: 10px 24px; border-radius: 6px;
            font-size: 18px; font-weight: bold; z-index: 200;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15); pointer-events: none;
        }
        .panel {
            position: absolute; top: 80px; right: 20px; width: 280px;
            background: rgba(255,255,255,0.95); padding: 16px; border-radius: 8px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.15); z-index: 200;
        }
        .panel h3 { margin: 0 0 8px 0; font-size: 14px; }
        .btn-row { display: flex; gap: 8px; margin-top: 8px; }
        .btn-row button {
            flex: 1; padding: 6px 0; font-size: 12px;
            border: 1px solid #d9d9d9; border-radius: 4px;
            background: white; cursor: pointer;
        }
        .btn-row button:hover { border-color: #1890ff; color: #1890ff; }
        .tip {
            margin-top: 10px; padding: 8px; font-size: 11px; line-height: 1.6;
            background: #fff7e6; border-left: 3px solid #faad14; border-radius: 3px; color: #614700;
        }
        /* 自制比例尺：ScaleBar 组件不支持 Scene，故用 view.scale 自行实现 */
        .scale-bar {
            position: absolute; bottom: 24px; left: 24px; z-index: 200;
            background: rgba(255,255,255,0.9); padding: 6px 10px; border-radius: 4px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.2); font-size: 12px; text-align: center;
        }
        .scale-line {
            height: 6px; border: 2px solid #333; border-top: none;
            margin-bottom: 4px; transition: width 0.15s;
        }
        .status {
            position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.7); color: white; padding: 8px 20px;
            border-radius: 20px; font-size: 13px; z-index: 200; pointer-events: none;
        }
    </style>
</head>
<body>
<h1 class="page-title">第49课：场景组件1 - Legend / ScaleBar / Compass / Zoom</h1>

<!-- arcgis-scene 组件容器：子组件通过 slot 自动绑定视图 -->
<arcgis-scene id="sceneView"
        camera-position="116.397, 39.908, 1500"
        camera-tilt="60"
        camera-heading="20">
    <arcgis-zoom slot="top-left"></arcgis-zoom>
    <arcgis-compass slot="top-left"></arcgis-compass>
    <arcgis-legend slot="bottom-right"></arcgis-legend>
</arcgis-scene>

<div class="panel">
    <h3>🗂 Legend 图例</h3>
    <div class="btn-row">
        <button id="btnClassic">经典样式</button>
        <button id="btnCard">卡片样式</button>
    </div>
    <div class="btn-row">
        <button id="btnInView">仅显示视野内图层</button>
    </div>

    <h3 style="margin-top: 12px;">🧭 Compass 指北针</h3>
    <div class="btn-row">
        <button id="btnReset">复位正北</button>
        <button id="btnHeading">读取当前朝向</button>
    </div>

    <div class="tip">
        ⚠️ <b>ScaleBar 组件不支持 Scene</b>（官方限制），故本示例用
        <code>reactiveUtils.watch(() =&gt; view.scale)</code>
        自制左下角比例尺。
    </div>
</div>

<!-- 自制比例尺 -->
<div class="scale-bar">
    <div class="scale-line" id="scaleLine" style="width: 120px;"></div>
    <span id="scaleText">--</span>
</div>

<div class="status" id="st">场景组件1 | 缩放旋转地图，观察图例与自制比例尺联动</div>

<script type="module">
    const Map = await $arcgis.import("@arcgis/core/Map.js");
    const FeatureLayer = await $arcgis.import("@arcgis/core/layers/FeatureLayer.js");
    const Graphic = await $arcgis.import("@arcgis/core/Graphic.js");
    const ElevationLayer = await $arcgis.import("@arcgis/core/layers/ElevationLayer.js");
    const reactiveUtils = await $arcgis.import("@arcgis/core/core/reactiveUtils.js");
    const getTianditu = await $arcgis.import("https://openlayers.vip/examples/resources/tianditu.js");

    const tl = getTianditu.default({ type: "vec_w" });
    const map = new Map({
        basemap: { baseLayers: [tl.base, tl.anno] },
        ground: {
            surface: {
                elevationLayers: [new ElevationLayer({
                    url: "https://www.geosceneonline.cn/image/rest/services/OpenData/ChinaTerrain3D/ImageServer/"
                })]
            }
        }
    });

    // 客户端要素图层（Legend 不支持 GraphicsLayer，故用 FeatureLayer）
    // 注意：Legend 不支持「含多个 symbolLayer 的 3D 符号」，此处每个符号只用单个 object 图层
    const cats = ["监测站", "泵站", "阀门"];
    const colors = [[227, 74, 51], [56, 135, 220], [60, 180, 110]];
    const graphics = [];
    for (let i = 0; i < 60; i++) {
        graphics.push(new Graphic({
            geometry: {
                type: "point",
                x: 116.36 + Math.random() * 0.08,
                y: 39.87 + Math.random() * 0.07,
                z: 50 + Math.random() * 300,
                spatialReference: { wkid: 4326 }
            },
            attributes: { OBJECTID: i + 1, NAME: "点位" + (i + 1), CATEGORY: cats[i % 3] }
        }));
    }
    const pointLayer = new FeatureLayer({
        source: graphics,
        objectIdField: "OBJECTID",
        fields: [
            { name: "OBJECTID", type: "oid" },
            { name: "NAME", type: "string" },
            { name: "CATEGORY", type: "string" }
        ],
        geometryType: "point",
        spatialReference: { wkid: 4326 },
        title: "管网监测点",
        elevationInfo: { mode: "relative-to-ground" },
        renderer: {
            type: "unique-value",
            field: "CATEGORY",
            uniqueValueInfos: cats.map((cat, i) => ({
                value: cat,
                label: cat,
                symbol: {
                    type: "point-3d",
                    symbolLayers: [{
                        type: "object",
                        resource: { primitive: "sphere" },
                        width: 160, height: 160, depth: 160,
                        material: { color: colors[i] }
                    }]
                }
            }))
        }
    });
    map.add(pointLayer);

    // ===== 绑定组件与视图 =====
    const viewElement = document.querySelector("arcgis-scene");
    const view = viewElement.view;
    view.map = map;
    await viewElement.viewOnReady();

    const legendEl = document.querySelector("arcgis-legend");
    const compassEl = document.querySelector("arcgis-compass");
    await legendEl.componentOnReady();
    await compassEl.componentOnReady();

    await pointLayer.when();
    view.goTo(pointLayer.fullExtent, { duration: 1500 }).catch(() => {});

    function setStatus(msg) { document.getElementById("st").textContent = msg; }

    // ===== 自制比例尺：监听 view.scale 实时换算 =====
    // 96 DPI 下 1 像素 ≈ 0.0002645833 米，地面距离 = scale × 像素数 × 该系数
    const CANDIDATES = [10, 20, 50, 100, 200, 500, 1000, 2000, 5000, 10000, 20000, 50000, 100000, 200000, 500000];
    function updateScaleBar() {
        const metersPerPixel = view.scale * 0.0002645833;
        let target = CANDIDATES[CANDIDATES.length - 1];
        for (const d of CANDIDATES) {
            if (d / metersPerPixel >= 80) { target = d; break; }
        }
        const px = Math.round(target / metersPerPixel);
        document.getElementById("scaleLine").style.width = px + "px";
        document.getElementById("scaleText").textContent = target >= 1000 ? (target / 1000) + " km" : target + " m";
    }
    const scaleHandle = reactiveUtils.watch(() => view.scale, updateScaleBar, { initial: true });

    // ===== 图例样式切换 =====
    document.getElementById("btnClassic").onclick = () => {
        legendEl.legendStyle = "classic";
        setStatus("图例已切换为 classic（经典列表样式）");
    };
    document.getElementById("btnCard").onclick = () => {
        legendEl.legendStyle = { type: "card", layout: "stack" };
        setStatus("图例已切换为 card（卡片样式，stack 布局）");
    };
    document.getElementById("btnInView").onclick = () => {
        legendEl.hideLayersNotInCurrentView = !legendEl.hideLayersNotInCurrentView;
        setStatus("hideLayersNotInCurrentView = " + legendEl.hideLayersNotInCurrentView + "（只显示当前视野内的图层）");
    };

    // ===== 指北针 =====
    document.getElementById("btnReset").onclick = async () => {
        await compassEl.reset();
        setStatus("指北针已复位：视角回到正北（heading = 0）");
    };
    document.getElementById("btnHeading").onclick = () => {
        const h = view.camera.heading.toFixed(1);
        setStatus("当前相机朝向 heading = " + h + "°（点击指北针或按复位按钮可回正）");
    };

    setStatus("场景组件1 就绪 | Legend 已渲染 3 类点位，左下角为自制比例尺");
</script>
</body>
</html>
