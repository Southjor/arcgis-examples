<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>第15课：FeatureLayer 要素图层</title>
    <link rel="stylesheet" href="https://js.arcgis.com/5.0/esri/themes/light/main.css">
    <script type="module" src="https://js.arcgis.com/5.0/"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: "Microsoft YaHei", sans-serif; }
        #mapContainer { width: 100vw; height: 100vh; }
        .page-title {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(255,255,255,0.95); padding: 10px 24px; border-radius: 6px;
            font-size: 18px; font-weight: bold; z-index: 100;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }
        .control-panel {
            position: absolute; top: 80px; right: 20px;
            background: rgba(255,255,255,0.95); padding: 16px; border-radius: 8px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.15);
            z-index: 100; min-width: 300px;
        }
        .control-panel h3 { margin: 0 0 8px 0; font-size: 14px; color: #333; }
        .section { margin-bottom: 12px; padding-bottom: 10px; border-bottom: 1px solid #eee; }
        .section:last-child { border-bottom: none; margin-bottom: 0; }
        .btn-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
        .btn-row button {
            flex: 1; min-width: 60px; padding: 6px 0;
            border: 1px solid #d9d9d9; border-radius: 4px;
            background: white; cursor: pointer; font-size: 12px;
        }
        .btn-row button:hover { border-color: #1890ff; color: #1890ff; }
        .btn-row button.on { background: #1890ff; color: white; border-color: #1890ff; }
        .info-card {
            margin-top: 10px; padding: 10px 12px;
            background: #f0f5ff; border-radius: 6px;
            border-left: 3px solid #1890ff; font-size: 12px; line-height: 1.6;
        }
        .info-card .val { font-weight: bold; color: #1890ff; }
        .status-text {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.7); color: white; padding: 8px 20px;
            border-radius: 20px; font-size: 13px; z-index: 100; pointer-events: none;
            white-space: nowrap;
        }
    </style>
</head>
<body>
<h1 class="page-title">第15课：FeatureLayer 要素图层</h1>

<div class="control-panel">
    <div class="section">
        <h3>🏢 上海建筑图层（Polygon + Extrude）</h3>
        <div class="btn-row">
            <button id="btnShow" class="on">🏗️ 显示建筑</button>
            <button id="btnFlyTo">🎯 飞到上海</button>
        </div>
        <div class="btn-row">
            <button id="btnFilterHigh">📏 楼层 ≥ 10</button>
            <button id="btnFilterAll">📋 显示全部</button>
        </div>
    </div>

    <div class="section">
        <h3>📏 高程与渲染</h3>
        <div class="btn-row">
            <button id="btnElevMode">📐 切换高程</button>
            <button id="btnOpacity">🌗 切换透明度</button>
        </div>
    </div>

    <div class="section">
        <h3>🔍 查询（queryFeatures）</h3>
        <div class="btn-row">
            <button id="btnQuery">🔍 查询高层建筑（≥20层）</button>
        </div>
    </div>

    <div class="info-card">
        <div>图层状态：<span class="val" id="layerStatus">加载中...</span></div>
        <div>点击建筑查看 Popup ↑</div>
    </div>
</div>

<div class="status-text" id="statusText">FeatureLayer | 上海建筑数据 · 点击查看 Popup 信息</div>

<div id="mapContainer"></div>

<script type="module">
    const Map = await $arcgis.import("@arcgis/core/Map.js");
    const SceneView = await $arcgis.import("@arcgis/core/views/SceneView.js");
    const FeatureLayer = await $arcgis.import("@arcgis/core/layers/FeatureLayer.js");
    const ElevationLayer = await $arcgis.import("@arcgis/core/layers/ElevationLayer.js");
    const getTianditu = await $arcgis.import("https://openlayers.vip/examples/resources/tianditu.js");

    const vecLayers = getTianditu.default({ type: "vec_w" });

    const map = new Map({
        basemap: { baseLayers: [vecLayers.base, vecLayers.anno] },
        ground: {
            surface: {
                elevationLayers: [new ElevationLayer({
                    url: "https://www.geosceneonline.cn/image/rest/services/OpenData/ChinaTerrain3D/ImageServer/"
                })]
            }
        }
    });

    const view = new SceneView({
        container: "mapContainer", map: map,
        camera: {
            position: { longitude: 121.435, latitude: 31.245, z: 4000 },
            heading: 30, tilt: 60
        }
    });
    window.view = view;

    // ===== FeatureLayer：上海建筑（面要素 + Extrude拉伸） =====
    const buildingsLayer = new FeatureLayer({
        url: "https://gs3d.geosceneonline.cn/server/rest/services/Hosted/ShangHaiBuilding/FeatureServer/0",
        elevationInfo: { mode: "on-the-ground" },
        outFields: ["id", "floor", "year"],
        renderer: {
            type: "simple",
            symbol: {
                type: "polygon-3d",
                symbolLayers: [{
                    type: "extrude",
                    material: { color: "#D4B87C" },
                    edges: { type: "solid", color: "#999999", size: 0.5 }
                }]
            },
            visualVariables: [{
                type: "size",
                field: "floor",
                axis: "height",
                valueExpression: null,
                valueUnit: "unknown"
            }]
        },
        popupTemplate: {
            title: "建筑 #{id}",
            content: "<b>楼层：</b>{floor} 层<br><b>建造年份：</b>{year}年"
        }
    });
    map.add(buildingsLayer);

    // ===== 初始化 =====
    view.when(() => {
        console.log("场景加载完成");
        view.whenLayerView(buildingsLayer).then(() => {
            view.goTo(buildingsLayer.fullExtent, {
                duration: 2000, easing: "cubic-out", heading: 30, tilt: 60
            });
        });
        buildingsLayer.when(() => {
            document.getElementById("layerStatus").textContent = "已加载";
        });
    });

    function setStatus(msg) { document.getElementById("statusText").textContent = msg; }

    // 显示/隐藏
    document.getElementById("btnShow").addEventListener("click", function () {
        buildingsLayer.visible = !buildingsLayer.visible;
        this.classList.toggle("on", buildingsLayer.visible);
        setStatus("图层：" + (buildingsLayer.visible ? "显示" : "隐藏"));
    });

    // 飞到上海
    document.getElementById("btnFlyTo").addEventListener("click", () => {
        view.goTo(buildingsLayer.fullExtent, { duration: 2000, easing: "cubic-out", heading: 30, tilt: 60 });
        setStatus("飞到上海建筑数据区");
    });

    // 过滤
    document.getElementById("btnFilterHigh").addEventListener("click", () => {
        buildingsLayer.definitionExpression = "floor >= 10";
        document.getElementById("btnFilterHigh").classList.add("on");
        document.getElementById("btnFilterAll").classList.remove("on");
        setStatus("过滤：floor >= 10");
    });
    document.getElementById("btnFilterAll").addEventListener("click", () => {
        buildingsLayer.definitionExpression = "";
        document.getElementById("btnFilterAll").classList.add("on");
        document.getElementById("btnFilterHigh").classList.remove("on");
        setStatus("过滤已清除，显示全部建筑");
    });

    // 切换高程模式
    let elevOnGround = true;
    document.getElementById("btnElevMode").addEventListener("click", () => {
        elevOnGround = !elevOnGround;
        buildingsLayer.elevationInfo = elevOnGround
            ? { mode: "on-the-ground" }
            : { mode: "relative-to-ground", offset: 50 };
        this.classList.toggle("on", !elevOnGround);
        setStatus("elevationInfo: " + (elevOnGround ? "on-the-ground" : "relative-to-ground +50m"));
    });

    // 切换透明度
    document.getElementById("btnOpacity").addEventListener("click", () => {
        buildingsLayer.opacity = buildingsLayer.opacity === 1 ? 0.4 : 1;
        setStatus("透明度：" + buildingsLayer.opacity);
    });

    // 查询
    document.getElementById("btnQuery").addEventListener("click", async () => {
        setStatus("正在查询 floor >= 20 的高层建筑...");
        try {
            const result = await buildingsLayer.queryFeatures({
                where: "floor >= 20",
                outFields: ["id", "floor"],
                returnGeometry: false
            });
            setStatus(`查询完成：${result.features.length} 栋建筑 ≥ 20层`);
        } catch (err) {
            console.error(err);
            setStatus("查询失败：" + err.message);
        }
    });
</script>
</body>
</html>
