<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>第45课：鼠标悬停显示信息</title>
    <link rel="stylesheet" href="https://js.arcgis.com/5.0/esri/themes/light/main.css">
    <script type="module" src="https://js.arcgis.com/5.0/"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: "Microsoft YaHei", sans-serif; }
        #mapContainer { width: 100vw; height: 100vh; }
        .page-title {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(255,255,255,0.95); padding: 10px 24px; border-radius: 6px;
            font-size: 18px; font-weight: bold; z-index: 100;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }
        .control-panel {
            position: absolute; top: 80px; right: 20px;
            background: rgba(255,255,255,0.95); padding: 16px; border-radius: 8px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.15);
            z-index: 100; min-width: 240px;
        }
        .control-panel h3 { margin: 0 0 8px 0; font-size: 14px; color: #333; }
        .btn-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
        .btn-row button {
            flex: 1; min-width: 100px; padding: 6px 0;
            border: 1px solid #d9d9d9; border-radius: 4px;
            background: white; cursor: pointer; font-size: 12px;
        }
        .btn-row button:hover { border-color: #1890ff; color: #1890ff; }
        .btn-row button.on { background: #1890ff; color: white; border-color: #1890ff; }
        .info-card {
            margin-top: 10px; padding: 10px 12px;
            background: #f0f5ff; border-radius: 6px;
            border-left: 3px solid #1890ff; font-size: 12px; line-height: 1.8;
        }
        .info-card .val { font-weight: bold; color: #1890ff; }
        /* 悬停 tooltip */
        #tooltip {
            position: absolute; display: none;
            background: rgba(0,0,0,0.78); color: #fff;
            padding: 6px 10px; border-radius: 4px; font-size: 12px;
            pointer-events: none; z-index: 101; white-space: nowrap;
            transform: translate(12px, 12px);
        }
        .status-text {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.7); color: white; padding: 8px 20px;
            border-radius: 20px; font-size: 13px; z-index: 100; pointer-events: none;
            white-space: nowrap;
        }
    </style>
</head>
<body>
<h1 class="page-title">第45课：鼠标悬停显示信息</h1>

<div class="control-panel">
    <h3>🖱️ 悬停设置</h3>
    <div class="btn-row">
        <button id="btnHover" class="on">💡 悬停提示开</button>
    </div>
    <div class="info-card">
        <div>悬停要素：<span class="val" id="hoverName">—</span></div>
        <div>所属图层：<span class="val" id="hoverLayer">—</span></div>
    </div>
</div>

<div id="tooltip"></div>
<div class="status-text" id="statusText">Hover | 鼠标悬停显示要素信息</div>

<div id="mapContainer"></div>

<script type="module">
    const [Map, SceneView, FeatureLayer, GraphicsLayer, Graphic] = await $arcgis.import([
        "@arcgis/core/Map.js",
        "@arcgis/core/views/SceneView.js",
        "@arcgis/core/layers/FeatureLayer.js",
        "@arcgis/core/layers/GraphicsLayer.js",
        "@arcgis/core/Graphic.js"
    ]);
    const getTianditu = await $arcgis.import("https://openlayers.vip/examples/resources/tianditu.js");

    const vecLayers = getTianditu.default({ type: "vec_w" });
    const map = new Map({ basemap: { baseLayers: [vecLayers.base, vecLayers.anno] } });

    const view = new SceneView({
        container: "mapContainer", map: map,
        camera: {
            position: { longitude: 121.498, latitude: 31.205, z: 4000 },
            heading: 20, tilt: 60
        }
    });

    // ===== 监测点图层 =====
    function buildMonitorLayer() {
        const cats = ["A类", "B类", "C类"];
        const colors = {
            "A类": [227, 74, 51],
            "B类": [56, 135, 220],
            "C类": [60, 180, 110]
        };
        const graphics = [];
        for (let i = 0; i < 90; i++) {
            graphics.push(new Graphic({
                geometry: {
                    type: "point",
                    x: 121.46 + Math.random() * 0.08,
                    y: 31.18 + Math.random() * 0.06,
                    z: 80 + Math.random() * 400,
                    spatialReference: { wkid: 4326 }
                },
                attributes: {
                    OBJECTID: i + 1,
                    NAME: "监测点" + (i + 1),
                    CATEGORY: cats[i % 3]
                }
            }));
        }
        return new FeatureLayer({
            source: graphics,
            objectIdField: "OBJECTID",
            fields: [
                { name: "OBJECTID", type: "oid" },
                { name: "NAME", type: "string" },
                { name: "CATEGORY", type: "string" }
            ],
            geometryType: "point",
            spatialReference: { wkid: 4326 },
            title: "实时监测点",
            elevationInfo: { mode: "relative-to-ground" },
            renderer: {
                type: "unique-value",
                field: "CATEGORY",
                uniqueValueInfos: cats.map(cat => ({
                    value: cat,
                    symbol: {
                        type: "point-3d",
                        symbolLayers: [{
                            type: "object",
                            resource: { primitive: "sphere" },
                            width: 220, height: 220, depth: 220,
                            material: { color: colors[cat] }
                        }]
                    }
                }))
            }
        });
    }

    // ===== 建筑体图层 =====
    function buildBuildingLayer() {
        const layer = new GraphicsLayer({ title: "重点建筑体" });
        const bases = [
            { x: 121.490, y: 31.230, h: 900, c: [120, 170, 230] },
            { x: 121.495, y: 31.225, h: 1400, c: [230, 160, 70] },
            { x: 121.500, y: 31.220, h: 700, c: [120, 200, 160] },
            { x: 121.485, y: 31.218, h: 1100, c: [200, 120, 200] }
        ];
        bases.forEach((b, idx) => {
            layer.add(new Graphic({
                geometry: { type: "point", x: b.x, y: b.y, z: 0, spatialReference: { wkid: 4326 } },
                symbol: {
                    type: "point-3d",
                    symbolLayers: [{
                        type: "object",
                        resource: { primitive: "cube" },
                        width: 350, depth: 350, height: b.h,
                        material: { color: b.c }
                    }]
                },
                attributes: { NAME: "建筑" + (idx + 1) }
            }));
        });
        return layer;
    }

    const monitorLayer = buildMonitorLayer();
    const buildingLayer = buildBuildingLayer();
    map.addMany([buildingLayer, monitorLayer]);

    const tooltip = document.getElementById("tooltip");
    let hoverOn = true;
    let lastTime = 0;

    // ===== 悬停拾取（pointer-move + hitTest，节流） =====
    view.on("pointer-move", async (event) => {
        if (!hoverOn) return;
        const now = Date.now();
        if (now - lastTime < 50) return;   // 节流，降低 hitTest 频率
        lastTime = now;

        const hit = await view.hitTest(event);
        const graphic = (hit.results || []).find(r => r.type === "graphic");

        if (graphic) {
            const name = graphic.graphic.attributes && graphic.graphic.attributes.NAME
                ? graphic.graphic.attributes.NAME : "要素";
            const layerTitle = graphic.layer ? graphic.layer.title : "—";
            tooltip.style.display = "block";
            tooltip.style.left = event.x + "px";
            tooltip.style.top = event.y + "px";
            tooltip.textContent = name + " ｜ " + layerTitle;
            document.getElementById("hoverName").textContent = name;
            document.getElementById("hoverLayer").textContent = layerTitle;
            document.getElementById("mapContainer").style.cursor = "pointer";
        } else {
            tooltip.style.display = "none";
            document.getElementById("hoverName").textContent = "—";
            document.getElementById("hoverLayer").textContent = "—";
            document.getElementById("mapContainer").style.cursor = "default";
        }
    });

    await view.when();
    await monitorLayer.when();
    view.goTo(monitorLayer.fullExtent, { duration: 1500 }).catch(() => {});
    setStatus("Hover 就绪 | 将鼠标移到球体或建筑上查看提示");

    function setStatus(msg) { document.getElementById("statusText").textContent = msg; }

    document.getElementById("btnHover").addEventListener("click", function () {
        hoverOn = !hoverOn;
        this.classList.toggle("on", hoverOn);
        if (!hoverOn) {
            tooltip.style.display = "none";
            document.getElementById("hoverName").textContent = "—";
            document.getElementById("hoverLayer").textContent = "—";
        }
        setStatus(hoverOn ? "悬停提示已开启" : "悬停提示已关闭");
    });
</script>
</body>
</html>
