<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>第27课：DisplayFilter 显示过滤器</title>
    <link rel="stylesheet" href="https://js.arcgis.com/5.0/esri/themes/light/main.css">
    <script type="module" src="https://js.arcgis.com/5.0/"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: "Microsoft YaHei", sans-serif; }
        #mapContainer { width: 100vw; height: 100vh; }
        .page-title {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(255,255,255,0.95); padding: 10px 24px; border-radius: 6px;
            font-size: 18px; font-weight: bold; z-index: 100;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }
        .control-panel {
            position: absolute; top: 80px; right: 20px;
            background: rgba(255,255,255,0.95); padding: 16px; border-radius: 8px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.15);
            z-index: 100; min-width: 300px;
        }
        .control-panel h3 { margin: 0 0 8px 0; font-size: 14px; color: #333; }
        .section { margin-bottom: 12px; padding-bottom: 10px; border-bottom: 1px solid #eee; }
        .section:last-child { border-bottom: none; margin-bottom: 0; }
        .btn-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
        .btn-row button {
            flex: 1; min-width: 60px; padding: 6px 0;
            border: 1px solid #d9d9d9; border-radius: 4px;
            background: white; cursor: pointer; font-size: 12px;
        }
        .btn-row button:hover { border-color: #1890ff; color: #1890ff; }
        .btn-row button.on { background: #1890ff; color: white; border-color: #1890ff; }
        .info-card {
            margin-top: 10px; padding: 10px 12px;
            background: #f0f5ff; border-radius: 6px;
            border-left: 3px solid #1890ff; font-size: 12px; line-height: 1.6;
        }
        .info-card .val { font-weight: bold; color: #1890ff; }
        .status-text {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.7); color: white; padding: 8px 20px;
            border-radius: 20px; font-size: 13px; z-index: 100; pointer-events: none;
            white-space: nowrap;
        }
    </style>
</head>
<body>
<h1 class="page-title">第27课：DisplayFilter 显示过滤器</h1>

<div class="control-panel">
    <div class="section">
        <h3>🔎 显示过滤器（DisplayFilter）</h3>
        <div class="btn-row">
            <button id="btnAll" class="on">🏙️ 全部建筑</button>
            <button id="btnTall">🏗️ 高层 ≥20层</button>
        </div>
        <div class="btn-row">
            <button id="btnMid">🏢 中层 10-19层</button>
            <button id="btnDisable">⏹️ 关闭过滤</button>
        </div>
    </div>
    <div class="info-card">
        <div>当前过滤：<span class="val" id="filterStatus">全部建筑</span></div>
        <div>显示过滤不影响查询</div>
    </div>
</div>

<div class="status-text" id="statusText">DisplayFilter | 显示过滤 · 不重新请求数据 · 保留全部要素</div>

<div id="mapContainer"></div>

<script type="module">
    const Map = await $arcgis.import("@arcgis/core/Map.js");
    const SceneView = await $arcgis.import("@arcgis/core/views/SceneView.js");
    const FeatureLayer = await $arcgis.import("@arcgis/core/layers/FeatureLayer.js");
    const DisplayFilter = await $arcgis.import("@arcgis/core/layers/support/DisplayFilter.js");
    const DisplayFilterInfo = await $arcgis.import("@arcgis/core/layers/support/DisplayFilterInfo.js");
    const getTianditu = await $arcgis.import("https://openlayers.vip/examples/resources/tianditu.js");

    const vecLayers = getTianditu.default({ type: "vec_w" });
    const map = new Map({ basemap: { baseLayers: [vecLayers.base, vecLayers.anno] } });

    const view = new SceneView({
        container: "mapContainer", map: map,
        camera: {
            position: { longitude: 121.435, latitude: 31.245, z: 4000 },
            heading: 30, tilt: 60
        }
    });
    window.view = view;

    const buildingsLayer = new FeatureLayer({
        url: "https://gs3d.geosceneonline.cn/server/rest/services/Hosted/ShangHaiBuilding/FeatureServer/0",
        elevationInfo: { mode: "on-the-ground" },
        outFields: ["id", "floor", "year"],
        renderer: {
            type: "simple",
            symbol: {
                type: "polygon-3d",
                symbolLayers: [{
                    type: "extrude",
                    material: { color: "#D4B87C" },
                    edges: { type: "solid", color: "#999999", size: 0.5 }
                }]
            },
            visualVariables: [{ type: "size", field: "floor", axis: "height", valueUnit: "unknown" }]
        }
    });
    map.add(buildingsLayer);

    view.when(() => {
        buildingsLayer.when(() => {
            // 配置显示过滤器
            buildingsLayer.displayFilterInfo = new DisplayFilterInfo({
                mode: "manual",
                filters: [
                    new DisplayFilter({ id: "all", title: "全部建筑", where: "1=1" }),
                    new DisplayFilter({ id: "tall", title: "高层(≥20层)", where: "floor >= 20" }),
                    new DisplayFilter({ id: "mid", title: "中层(10-19层)", where: "floor >= 10 AND floor < 20" })
                ],
                activeFilterId: "all"
            });
            buildingsLayer.displayFilterEnabled = true;
            view.displayFilterEnabled = true;
            view.goTo(buildingsLayer.fullExtent, { duration: 2000, easing: "cubic-out" });
        });
    });

    function setActive(id, label, btn) {
        buildingsLayer.displayFilterInfo.activeFilterId = id;
        document.querySelectorAll(".btn-row button").forEach(b => b.classList.remove("on"));
        btn.classList.add("on");
        document.getElementById("filterStatus").textContent = label;
        document.getElementById("statusText").textContent = "显示过滤：" + label;
    }

    document.getElementById("btnAll").addEventListener("click", function () {
        setActive("all", "全部建筑", this);
    });
    document.getElementById("btnTall").addEventListener("click", function () {
        setActive("tall", "高层 ≥20层", this);
    });
    document.getElementById("btnMid").addEventListener("click", function () {
        setActive("mid", "中层 10-19层", this);
    });
    document.getElementById("btnDisable").addEventListener("click", function () {
        buildingsLayer.displayFilterEnabled = false;
        document.querySelectorAll(".btn-row button").forEach(b => b.classList.remove("on"));
        this.classList.add("on");
        document.getElementById("filterStatus").textContent = "已关闭";
        document.getElementById("statusText").textContent = "显示过滤已关闭（显示全部）";
    });
</script>
</body>
</html>
