<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>第30b课：透明度 stops 与 Slice 组件</title>
    <link rel="stylesheet" href="https://js.arcgis.com/5.0/esri/themes/light/main.css">
    <script type="module" src="https://js.arcgis.com/5.0/"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: "Microsoft YaHei", sans-serif; }
        #mapContainer { width: 100vw; height: 100vh; }
        .page-title {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(255,255,255,0.95); padding: 10px 24px; border-radius: 6px;
            font-size: 18px; font-weight: bold; z-index: 100;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }
        .control-panel {
            position: absolute; top: 80px; right: 20px;
            background: rgba(255,255,255,0.95); padding: 16px; border-radius: 8px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.15);
            z-index: 100; min-width: 330px;
        }
        .control-panel h3 { margin: 0 0 8px 0; font-size: 14px; color: #333; }
        .section { margin-bottom: 12px; padding-bottom: 10px; border-bottom: 1px solid #eee; }
        .section:last-child { border-bottom: none; margin-bottom: 0; }
        .btn-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
        .btn-row button {
            flex: 1; min-width: 70px; padding: 6px 0;
            border: 1px solid #d9d9d9; border-radius: 4px;
            background: white; cursor: pointer; font-size: 12px;
        }
        .btn-row button:hover { border-color: #1890ff; color: #1890ff; }
        .btn-row button.on { background: #1890ff; color: white; border-color: #1890ff; }
        .info-card {
            margin-top: 10px; padding: 10px 12px;
            background: #f0f5ff; border-radius: 6px;
            border-left: 3px solid #1890ff; font-size: 12px; line-height: 1.7;
        }
        .info-card .val { font-weight: bold; color: #1890ff; }
        .status-text {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.7); color: white; padding: 8px 20px;
            border-radius: 20px; font-size: 13px; z-index: 100; pointer-events: none;
            white-space: nowrap;
        }
    </style>
</head>
<body>
<h1 class="page-title">第30b课：透明度 stops 与 Slice 组件</h1>

<div class="control-panel">
    <div class="section">
        <h3>🌫️ 透明度 stops（opacityStops）</h3>
        <div class="btn-row">
            <button id="btnOpNone">不透明</button>
            <button id="btnOpLow" class="on">低值透明</button>
            <button id="btnOpHigh">高值透明</button>
        </div>
        <div style="font-size:11px;color:#888;margin-top:4px;">透明化让内部结构可见 —— 体元体积渲染的灵魂</div>
    </div>

    <div class="section">
        <h3>🔪 Slice 分析组件（交互切割）</h3>
        <div class="btn-row">
            <button id="btnNewSlice">开始新切片</button>
            <button id="btnSliceToggle">显示 / 隐藏组件</button>
        </div>
    </div>

    <div class="info-card">
        <div>当前透明度方案：<span class="val" id="curOp">低值透明</span></div>
        <div>组件 vs 属性切片：<span class="val">组件临时、属性切片持久</span></div>
    </div>
</div>

<div class="status-text" id="statusText">opacityStops + Slice 组件 | 低值透明突出内部高值</div>

<div id="mapContainer"></div>

<script type="module">
    const Map = await $arcgis.import("@arcgis/core/Map.js");
    const SceneView = await $arcgis.import("@arcgis/core/views/SceneView.js");
    const VoxelLayer = await $arcgis.import("@arcgis/core/layers/VoxelLayer.js");
    const Slice = await $arcgis.import("@arcgis/core/widgets/Slice.js");
    const getTianditu = await $arcgis.import("https://openlayers.vip/examples/resources/tianditu.js");

    const vecLayers = getTianditu.default({ type: "vec_w" });
    const map = new Map({ basemap: { baseLayers: [vecLayers.base, vecLayers.anno] } });

    const view = new SceneView({
        container: "mapContainer", map: map,
        viewingMode: "local",
        camera: { position: { longitude: 116.4, latitude: 39.9, z: 2000000 }, heading: 0, tilt: 60 }
    });
    window.view = view;

    const voxelLayer = new VoxelLayer({
        url: "https://gs3d.geosceneonline.cn/server/rest/services/Hosted/VoxelPM10/SceneServer"
    });
    map.add(voxelLayer);

    const symbol = { type: "mesh-3d", symbolLayers: [{ type: "fill" }] };

    const cfg = { op: "low" };
    let sliceWidget = null;

    // 三档透明度方案：opacityStops 的 opacity 为 0~1，position 为归一化位置 0~1
    const OP_PRESETS = {
        none: {  // 全不透明：整体色块（对照）
            label: "不透明",
            stops: [
                { opacity: 1, position: 0 },
                { opacity: 1, position: 1 }
            ]
        },
        low: {   // 低值透明：隐去低浓度，突出高值内部结构
            label: "低值透明",
            stops: [
                { opacity: 0, position: 0 },
                { opacity: 0.05, position: 0.4 },
                { opacity: 0.6, position: 0.7 },
                { opacity: 1, position: 1 }
            ]
        },
        high: {  // 高值透明：隐去高浓度，聚焦低值分布
            label: "高值透明",
            stops: [
                { opacity: 1, position: 0 },
                { opacity: 0.4, position: 0.6 },
                { opacity: 0, position: 1 }
            ]
        }
    };

    function applyOpacity(mode) {
        const preset = OP_PRESETS[mode];
        const vs = voxelLayer.getVariableStyle(voxelLayer.currentVariableId);
        if (!vs || !vs.transferFunction) {
            setStatus("未取到 transferFunction");
            return;
        }
        // 直接赋值 Collection 属性即生效（autocast VoxelOpacityStop）
        vs.transferFunction.opacityStops = preset.stops;
        document.getElementById("curOp").textContent = preset.label;
        document.querySelectorAll("#btnOpNone, #btnOpLow, #btnOpHigh").forEach(b => b.classList.remove("on"));
        document.getElementById("btnOp" + mode.charAt(0).toUpperCase() + mode.slice(1)).classList.add("on");
        setStatus("透明度方案：" + preset.label + "（opacityStops 已更新）");
    }

    view.when(() => {
        voxelLayer.when(() => {
            voxelLayer.popupEnabled = true;
            applyOpacity(cfg.op);
            view.goTo(voxelLayer.fullExtent, { duration: 2000 });

            // Slice 分析组件：交互式切割（临时可视化，不持久化）
            sliceWidget = new Slice({ view: view });
            view.ui.add(sliceWidget, { position: "bottom-right", index: 0 });
        }).catch(err => {
            document.getElementById("statusText").textContent = "体元图层加载失败";
            console.error(err);
        });
    });

    function setStatus(msg) { document.getElementById("st").textContent = msg; }

    document.getElementById("btnOpNone").addEventListener("click", () => applyOpacity("none"));
    document.getElementById("btnOpLow").addEventListener("click", () => applyOpacity("low"));
    document.getElementById("btnOpHigh").addEventListener("click", () => applyOpacity("high"));

    // 开始新切片：SliceViewModel.newSlice() 进入交互切割模式
    document.getElementById("btnNewSlice").addEventListener("click", function () {
        try {
            sliceWidget.viewModel.newSlice();
            this.classList.add("on");
            setStatus("Slice 组件切割中：拖动平面手柄调整位置（官方：体元将切片视为无限平面，忽略范围）");
        } catch (err) {
            setStatus("newSlice 失败：" + err.message);
        }
    });

    document.getElementById("btnSliceToggle").addEventListener("click", function () {
        const el = sliceWidget.container || sliceWidget.domNode;
        const visible = el.style.display !== "none";
        el.style.display = visible ? "none" : "block";
        this.classList.toggle("on", !visible);
        setStatus("Slice 组件：" + (!visible ? "显示" : "隐藏") + "（切割效果仍保留）");
    });
</script>
</body>
</html>
