<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>第38课：三维要素聚合 FeatureReduction</title>
    <link rel="stylesheet" href="https://js.arcgis.com/5.0/esri/themes/light/main.css">
    <script type="module" src="https://js.arcgis.com/5.0/"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: "Microsoft YaHei", sans-serif; }
        #mapContainer { width: 100vw; height: 100vh; }
        .page-title {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(255,255,255,0.95); padding: 10px 24px; border-radius: 6px;
            font-size: 18px; font-weight: bold; z-index: 100;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }
        .control-panel {
            position: absolute; top: 80px; right: 20px;
            background: rgba(255,255,255,0.95); padding: 16px; border-radius: 8px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.15);
            z-index: 100; min-width: 260px;
        }
        .control-panel h3 { margin: 0 0 8px 0; font-size: 14px; color: #333; }
        .btn-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
        .btn-row button {
            flex: 1; min-width: 70px; padding: 6px 0;
            border: 1px solid #d9d9d9; border-radius: 4px;
            background: white; cursor: pointer; font-size: 12px;
        }
        .btn-row button:hover { border-color: #1890ff; color: #1890ff; }
        .btn-row button.on { background: #1890ff; color: white; border-color: #1890ff; }
        .info-card {
            margin-top: 10px; padding: 10px 12px;
            background: #f0f5ff; border-radius: 6px;
            border-left: 3px solid #1890ff; font-size: 12px; line-height: 1.8;
        }
        .info-card .val { font-weight: bold; color: #1890ff; }
        .status-text {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.7); color: white; padding: 8px 20px;
            border-radius: 20px; font-size: 13px; z-index: 100; pointer-events: none;
            white-space: nowrap;
        }
    </style>
</head>
<body>
<h1 class="page-title">第38课：三维要素聚合 FeatureReduction</h1>

<div class="control-panel">
    <h3>⛽ 加油站点位（1000 个）</h3>
    <div class="btn-row">
        <button id="btnReduce" class="on">🔀 开启聚合</button>
        <button id="btnAll">🔵 全部显示</button>
    </div>
    <div class="info-card">
        <div>聚合方式：<span class="val" id="mode">selection（3D 抽稀）</span></div>
        <div>点位总数：<span class="val">1000</span></div>
        <div>说明：<span class="val">远距抽稀、近距散开</span></div>
    </div>
</div>

<div class="status-text" id="statusText">FeatureReduction | 3D 场景中的点位抽稀聚合</div>

<div id="mapContainer"></div>

<script type="module">
    const [Map, SceneView, FeatureLayer] = await $arcgis.import([
        "@arcgis/core/Map.js",
        "@arcgis/core/views/SceneView.js",
        "@arcgis/core/layers/FeatureLayer.js"
    ]);
    const getTianditu = await $arcgis.import("https://openlayers.vip/examples/resources/tianditu.js");

    const vecLayers = getTianditu.default({ type: "vec_w" });
    const map = new Map({ basemap: { baseLayers: [vecLayers.base, vecLayers.anno] } });

    const view = new SceneView({
        container: "mapContainer", map: map,
        camera: {
            position: { longitude: 116.40, latitude: 39.85, z: 90000 },
            heading: 0, tilt: 55
        }
    });

    // ===== 生成 1000 个客户端点位（模拟全国加油站，集中在华北） =====
    const graphics = [];
    for (let i = 1; i <= 1000; i++) {
        graphics.push({
            geometry: {
                type: "point",
                x: 115.5 + Math.random() * 2.2,
                y: 39.2 + Math.random() * 1.4,
                spatialReference: { wkid: 4326 }
            },
            attributes: { ObjectID: i, name: "加油站-" + i }
        });
    }

    const stationLayer = new FeatureLayer({
        source: graphics,
        objectIdField: "ObjectID",
        geometryType: "point",
        spatialReference: { wkid: 4326 },
        fields: [
            { name: "ObjectID", type: "oid" },
            { name: "name", alias: "名称", type: "string" }
        ],
        elevationInfo: { mode: "on-the-ground" },
        renderer: {
            type: "simple",
            symbol: {
                type: "point-3d",
                symbolLayers: [{
                    type: "icon",
                    resource: { primitive: "circle" },
                    size: 10,
                    material: { color: [230, 70, 40, 0.9] },
                    outline: { color: "white", size: 1 }
                }]
            }
        },
        // 3D 场景使用 selection 类型抽稀（cluster 仅二维支持）
        featureReduction: { type: "selection" }
    });
    map.add(stationLayer);

    await view.when();
    await stationLayer.when();
    view.goTo(stationLayer.fullExtent, { duration: 1500 }).catch(() => {});
    setStatus("已开启 selection 抽稀：重叠点位仅保留代表点");

    function setStatus(msg) { document.getElementById("statusText").textContent = msg; }

    // 开启聚合抽稀
    document.getElementById("btnReduce").addEventListener("click", function () {
        stationLayer.featureReduction = { type: "selection" };
        this.classList.add("on");
        document.getElementById("btnAll").classList.remove("on");
        document.getElementById("mode").textContent = "selection（3D 抽稀）";
        setStatus("已开启 selection 抽稀：拉远时自动减少重叠点");
    });

    // 全部显示（关闭聚合）
    document.getElementById("btnAll").addEventListener("click", function () {
        stationLayer.featureReduction = null;
        this.classList.add("on");
        document.getElementById("btnReduce").classList.remove("on");
        document.getElementById("mode").textContent = "无（全部渲染）";
        setStatus("已关闭聚合：1000 个点位全部渲染");
    });
</script>
</body>
</html>
