<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>第43课：空间查询 Spatial Query</title>
    <link rel="stylesheet" href="https://js.arcgis.com/5.0/esri/themes/light/main.css">
    <script type="module" src="https://js.arcgis.com/5.0/"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: "Microsoft YaHei", sans-serif; }
        #mapContainer { width: 100vw; height: 100vh; }
        .page-title {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(255,255,255,0.95); padding: 10px 24px; border-radius: 6px;
            font-size: 18px; font-weight: bold; z-index: 100;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }
        .control-panel {
            position: absolute; top: 80px; right: 20px;
            background: rgba(255,255,255,0.95); padding: 16px; border-radius: 8px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.15);
            z-index: 100; min-width: 260px;
        }
        .control-panel h3 { margin: 0 0 8px 0; font-size: 14px; color: #333; }
        .btn-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
        .btn-row button {
            flex: 1; min-width: 100px; padding: 6px 0;
            border: 1px solid #d9d9d9; border-radius: 4px;
            background: white; cursor: pointer; font-size: 12px;
        }
        .btn-row button:hover { border-color: #1890ff; color: #1890ff; }
        .btn-row button.on { background: #1890ff; color: white; border-color: #1890ff; }
        .info-card {
            margin-top: 10px; padding: 10px 12px;
            background: #f0f5ff; border-radius: 6px;
            border-left: 3px solid #1890ff; font-size: 12px; line-height: 1.8;
        }
        .info-card .val { font-weight: bold; color: #1890ff; }
        .status-text {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.7); color: white; padding: 8px 20px;
            border-radius: 20px; font-size: 13px; z-index: 100; pointer-events: none;
            white-space: nowrap;
        }
    </style>
</head>
<body>
<h1 class="page-title">第43课：空间查询 Spatial Query</h1>

<div class="control-panel">
    <h3>📐 空间查询</h3>
    <div class="btn-row">
        <button id="btnMode">✏️ 框选查询模式</button>
        <button id="btnClear">🧹 清除</button>
    </div>
    <div class="info-card">
        <div>状态：<span class="val" id="modeText">普通浏览</span></div>
        <div>选中数量：<span class="val" id="selCount">0</span></div>
        <div style="margin-top:4px;color:#666;">提示：开启后依次点击两点框选范围</div>
    </div>
</div>

<div class="status-text" id="statusText">Spatial Query | 按空间关系查询要素</div>

<div id="mapContainer"></div>

<script type="module">
    const [Map, SceneView, FeatureLayer, GraphicsLayer, Graphic] = await $arcgis.import([
        "@arcgis/core/Map.js",
        "@arcgis/core/views/SceneView.js",
        "@arcgis/core/layers/FeatureLayer.js",
        "@arcgis/core/layers/GraphicsLayer.js",
        "@arcgis/core/Graphic.js"
    ]);
    const getTianditu = await $arcgis.import("https://openlayers.vip/examples/resources/tianditu.js");

    const vecLayers = getTianditu.default({ type: "vec_w" });
    const map = new Map({ basemap: { baseLayers: [vecLayers.base, vecLayers.anno] } });

    const view = new SceneView({
        container: "mapContainer", map: map,
        camera: {
            position: { longitude: 121.498, latitude: 31.205, z: 4000 },
            heading: 20, tilt: 60
        }
    });

    // ===== 监测点图层（客户端 FeatureLayer） =====
    const monitorLayer = (() => {
        const cats = ["A类", "B类", "C类"];
        const colors = {
            "A类": [227, 74, 51],
            "B类": [56, 135, 220],
            "C类": [60, 180, 110]
        };
        const graphics = [];
        for (let i = 0; i < 120; i++) {
            graphics.push(new Graphic({
                geometry: {
                    type: "point",
                    x: 121.44 + Math.random() * 0.12,
                    y: 31.16 + Math.random() * 0.10,
                    z: 80 + Math.random() * 400,
                    spatialReference: { wkid: 4326 }
                },
                attributes: {
                    OBJECTID: i + 1,
                    NAME: "监测点" + (i + 1),
                    CATEGORY: cats[i % 3]
                }
            }));
        }
        return new FeatureLayer({
            source: graphics,
            objectIdField: "OBJECTID",
            fields: [
                { name: "OBJECTID", type: "oid" },
                { name: "NAME", type: "string" },
                { name: "CATEGORY", type: "string" }
            ],
            geometryType: "point",
            spatialReference: { wkid: 4326 },
            title: "实时监测点",
            elevationInfo: { mode: "relative-to-ground" },
            renderer: {
                type: "unique-value",
                field: "CATEGORY",
                uniqueValueInfos: cats.map(cat => ({
                    value: cat,
                    symbol: {
                        type: "point-3d",
                        symbolLayers: [{
                            type: "object",
                            resource: { primitive: "sphere" },
                            width: 200, height: 200, depth: 200,
                            material: { color: colors[cat] }
                        }]
                    }
                }))
            }
        });
    })();
    map.add(monitorLayer);

    // 临时图层：绘制查询范围框
    const drawLayer = new GraphicsLayer();
    map.add(drawLayer);

    let selectMode = false;
    let clickCount = 0;
    let pt1 = null;
    let highlightHandle = null;

    function clearAll() {
        drawLayer.removeAll();
        if (highlightHandle) { highlightHandle.remove(); highlightHandle = null; }
        clickCount = 0;
        pt1 = null;
        document.getElementById("selCount").textContent = "0";
    }

    // ===== 由两点构造矩形面 =====
    function buildRect(p1, p2) {
        return {
            type: "polygon",
            rings: [[
                [p1.x, p1.y],
                [p2.x, p1.y],
                [p2.x, p2.y],
                [p1.x, p2.y],
                [p1.x, p1.y]
            ]],
            spatialReference: p1.spatialReference
        };
    }

    // ===== 空间查询核心 =====
    async function spatialQuery(polygon) {
        if (highlightHandle) { highlightHandle.remove(); highlightHandle = null; }
        const query = monitorLayer.createQuery();
        query.geometry = polygon;
        query.spatialRelationship = "intersects";  // 相交即命中
        query.returnGeometry = true;
        query.outFields = ["NAME", "CATEGORY"];

        const result = await monitorLayer.queryFeatures(query);
        const features = result.features;
        document.getElementById("selCount").textContent = features.length;

        const lv = await view.whenLayerView(monitorLayer);
        highlightHandle = lv.highlight(features);

        setStatus("空间查询命中 " + features.length + " 个要素（intersects）");
    }

    view.on("click", (event) => {
        if (!selectMode) return;          // 仅框选模式下响应
        if (clickCount === 0) {
            pt1 = event.mapPoint;
            clickCount = 1;
            setStatus("已记录第一点，请点击第二点");
        } else {
            const pt2 = event.mapPoint;
            const polygon = buildRect(pt1, pt2);
            // 绘制范围框
            drawLayer.removeAll();
            drawLayer.add(new Graphic({
                geometry: polygon,
                symbol: {
                    type: "simple-fill",
                    color: [24, 144, 255, 0.15],
                    outline: { color: [24, 144, 255], width: 2 }
                }
            }));
            clickCount = 0;
            pt1 = null;
            spatialQuery(polygon);
        }
    });

    await view.when();
    await monitorLayer.when();
    view.goTo(monitorLayer.fullExtent, { duration: 1500 }).catch(() => {});
    setStatus("Spatial Query 就绪 | 开启框选模式后点击两点查询");

    function setStatus(msg) { document.getElementById("statusText").textContent = msg; }

    document.getElementById("btnMode").addEventListener("click", function () {
        selectMode = !selectMode;
        view.popupEnabled = !selectMode;   // 框选模式下关闭自动弹窗
        this.classList.toggle("on", selectMode);
        document.getElementById("modeText").textContent = selectMode ? "框选查询中" : "普通浏览";
        if (!selectMode) clearAll();
        setStatus(selectMode ? "框选模式已开启，点击两点" : "已退出框选模式");
    });
    document.getElementById("btnClear").addEventListener("click", () => {
        clearAll();
        setStatus("已清除范围与高亮");
    });
</script>
</body>
</html>
