<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>第16课：禁用视图交互</title>
    <link rel="stylesheet" href="https://js.arcgis.com/5.0/esri/themes/light/main.css">
    <script type="module" src="https://js.arcgis.com/5.0/"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: "Microsoft YaHei", sans-serif; }
        #mapContainer { width: 100vw; height: 100vh; }
        .page-title {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(255,255,255,0.95); padding: 10px 24px; border-radius: 6px;
            font-size: 18px; font-weight: bold; z-index: 100;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }
        .control-panel {
            position: absolute; top: 80px; right: 20px;
            background: rgba(255,255,255,0.95); padding: 16px; border-radius: 8px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.15);
            z-index: 100; min-width: 260px;
        }
        .control-panel h3 { margin: 0 0 8px 0; font-size: 14px; }
        .btn-row { display: flex; gap: 8px; }
        .btn-row button {
            flex: 1; padding: 8px 0;
            border: 1px solid #d9d9d9; border-radius: 4px;
            background: white; cursor: pointer; font-size: 13px;
        }
        .btn-row button.on { background: #1890ff; color: white; border-color: #1890ff; }
        .btn-row button.locked {
            background: #ff4d4f; color: white; border-color: #ff4d4f;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.7; } }
        .status-text {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.7); color: white; padding: 8px 20px;
            border-radius: 20px; font-size: 13px; z-index: 100; pointer-events: none;
        }
    </style>
</head>
<body>
<h1 class="page-title">第16课：禁用视图交互</h1>

<div class="control-panel">
    <h3>🔒 交互控制</h3>
    <div class="btn-row">
        <button id="btnLock" class="on">🔓 已解锁</button>
        <button id="btnAutoFly">🚁 自动飞</button>
    </div>
</div>

<div class="status-text" id="statusText">navigation.enabled = true | 当前：已解锁</div>
<div id="mapContainer"></div>

<script type="module">
    const Map = await $arcgis.import("@arcgis/core/Map.js");
    const SceneView = await $arcgis.import("@arcgis/core/views/SceneView.js");
    const ElevationLayer = await $arcgis.import("@arcgis/core/layers/ElevationLayer.js");
    const GraphicsLayer = await $arcgis.import("@arcgis/core/layers/GraphicsLayer.js");
    const Graphic = await $arcgis.import("@arcgis/core/Graphic.js");
    const Mesh = await $arcgis.import("@arcgis/core/geometry/Mesh.js");
    const Point = await $arcgis.import("@arcgis/core/geometry/Point.js");
    const getTianditu = await $arcgis.import("https://openlayers.vip/examples/resources/tianditu.js");

    const vecLayers = getTianditu.default({ type: "vec_w" });
    const map = new Map({
        basemap: { baseLayers: [vecLayers.base, vecLayers.anno] },
        ground: {
            surface: {
                elevationLayers: [new ElevationLayer({
                    url: "https://www.geosceneonline.cn/image/rest/services/OpenData/ChinaTerrain3D/ImageServer/"
                })]
            }
        }
    });

    const view = new SceneView({
        container: "mapContainer", map: map,
        camera: { position: { longitude: 116.397, latitude: 39.917, z: 3000 }, heading: 30, tilt: 50 }
    });
    window.view = view;

    // 参照物
    const gLayer = new GraphicsLayer({ title: "参照物", castShadows: true, receiveShadows: true });
    gLayer.add(new Graphic({
        geometry: Mesh.createBox(new Point({ longitude: 116.397, latitude: 39.917, z: 0 }), { size: { width: 200, height: 300, depth: 200 } }),
        symbol: { type: "mesh-3d", symbolLayers: [{ type: "fill", material: { color: [220, 180, 80, 0.9] } }] }
    }));
    map.add(gLayer);

    let flyInterval = null;
    const btnLock = document.getElementById("btnLock");
    function setStatus(msg) { document.getElementById("statusText").textContent = msg; }

    // 锁定/解锁切换
    document.getElementById("btnLock").addEventListener("click", function () {
        view.navigation.enabled = !view.navigation.enabled;
        this.textContent = view.navigation.enabled ? "🔓 已解锁" : "🔒 已锁定";
        this.className = view.navigation.enabled ? "on" : "locked";
        setStatus("navigation.enabled = " + view.navigation.enabled + " | " + (view.navigation.enabled ? "可自由操作" : "视角已锁定"));
    });

    // 自动飞行
    document.getElementById("btnAutoFly").addEventListener("click", function () {
        if (flyInterval) {
            clearInterval(flyInterval); flyInterval = null;
            this.textContent = "🚁 自动飞";
            return;
        }
        view.navigation.enabled = false;
        btnLock.textContent = "🔒 已锁定"; btnLock.className = "locked";
        setStatus("自动飞行中... | 视角已锁定");
        this.textContent = "⏹ 停止";
        flyInterval = setInterval(() => {
            const cam = view.camera.clone();
            cam.position.longitude += 0.0005;
            cam.heading = (cam.heading + 0.3) % 360;
            view.camera = cam;
        }, 30);
    });
</script>
</body>
</html>
