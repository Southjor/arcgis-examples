<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>第23课：GaussianSplatLayer 高斯泼溅</title>
    <link rel="stylesheet" href="https://js.arcgis.com/5.0/esri/themes/light/main.css">
    <script type="module" src="https://js.arcgis.com/5.0/"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: "Microsoft YaHei", sans-serif; }
        #mapContainer { width: 100vw; height: 100vh; }
        .page-title {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(255,255,255,0.95); padding: 10px 24px; border-radius: 6px;
            font-size: 18px; font-weight: bold; z-index: 100;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }
        .status {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.7); color: white; padding: 8px 20px;
            border-radius: 20px; font-size: 13px; z-index: 100; pointer-events: none;
        }
    </style>
</head>
<body>
<h1 class="page-title">第23课：GaussianSplatLayer 高斯泼溅</h1>
<div class="status" id="st">GaussianSplat | 加载中...</div>
<div id="mapContainer"></div>

<script type="module">
    const Map = await $arcgis.import("@arcgis/core/Map.js");
    const SceneView = await $arcgis.import("@arcgis/core/views/SceneView.js");
    const GaussianSplatLayer = await $arcgis.import("@arcgis/core/layers/GaussianSplatLayer.js");
    const getTianditu = await $arcgis.import("https://openlayers.vip/examples/resources/tianditu.js");

    const tl = getTianditu.default({ type: "vec_w" });
    const map = new Map({ basemap: { baseLayers: [tl.base, tl.anno] } });
    const view = new SceneView({ container: "mapContainer", map, zoom: 15, center: [108.8, 15.2] });
    window.view = view;

    // GaussianSplatLayer — 5.0 新特性，通过 URL 加载 Cesium ion 高斯泼溅（Boathouse_Hines）
    const gs = new GaussianSplatLayer({
        url: "https://tiles.arcgis.com/tiles/V6ZHFr6zdgNZuVG0/arcgis/rest/services/Portcoast_industrial/3DTilesServer/tileset.json",
        elevationInfo: { mode: "absolute-height", offset: 10 }
    });
    map.add(gs);

    await view.when();
    await gs.load();
    try {
        view.goTo(gs.fullExtent, { duration: 2000, easing: "cubic-out" });
        document.getElementById("st").textContent = "GaussianSplat | 5.0新特性已加载";
    } catch (e) {
        document.getElementById("st").textContent = "GaussianSplat | 加载失败：" + (e && e.message ? e.message : e);
        console.error(e);
    }
</script>
</body>
</html>
