<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>第40课：点击拾取要素 hitTest</title>
    <link rel="stylesheet" href="https://js.arcgis.com/5.0/esri/themes/light/main.css">
    <script type="module" src="https://js.arcgis.com/5.0/"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: "Microsoft YaHei", sans-serif; }
        #mapContainer { width: 100vw; height: 100vh; }
        .page-title {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(255,255,255,0.95); padding: 10px 24px; border-radius: 6px;
            font-size: 18px; font-weight: bold; z-index: 100;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }
        .control-panel {
            position: absolute; top: 80px; right: 20px;
            background: rgba(255,255,255,0.95); padding: 16px; border-radius: 8px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.15);
            z-index: 100; min-width: 260px;
        }
        .control-panel h3 { margin: 0 0 8px 0; font-size: 14px; color: #333; }
        .btn-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
        .btn-row button {
            flex: 1; min-width: 100px; padding: 6px 0;
            border: 1px solid #d9d9d9; border-radius: 4px;
            background: white; cursor: pointer; font-size: 12px;
        }
        .btn-row button:hover { border-color: #1890ff; color: #1890ff; }
        .btn-row button.on { background: #1890ff; color: white; border-color: #1890ff; }
        .info-card {
            margin-top: 10px; padding: 10px 12px;
            background: #f0f5ff; border-radius: 6px;
            border-left: 3px solid #1890ff; font-size: 12px; line-height: 1.8;
        }
        .info-card .val { font-weight: bold; color: #1890ff; }
        .status-text {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.7); color: white; padding: 8px 20px;
            border-radius: 20px; font-size: 13px; z-index: 100; pointer-events: none;
            white-space: nowrap;
        }
    </style>
</head>
<body>
<h1 class="page-title">第40课：点击拾取要素 hitTest</h1>

<div class="control-panel">
    <h3>🖱️ 拾取设置</h3>
    <div class="btn-row">
        <button id="btnOnlyMonitor" class="on">🎯 仅拾取监测点</button>
    </div>
    <div class="btn-row">
        <button id="btnClear">🧹 清除高亮</button>
    </div>
    <div class="info-card">
        <div>拾取要素：<span class="val" id="pickName">未拾取</span></div>
        <div>所属图层：<span class="val" id="pickLayer">—</span></div>
        <div>地面坐标：<span class="val" id="pickXY">—</span></div>
        <div>命中数：<span class="val" id="hitCount">0</span></div>
    </div>
</div>

<div class="status-text" id="statusText">hitTest | 点击场景中的要素进行拾取</div>

<div id="mapContainer"></div>

<script type="module">
    const [Map, SceneView, FeatureLayer, GraphicsLayer, Graphic] = await $arcgis.import([
        "@arcgis/core/Map.js",
        "@arcgis/core/views/SceneView.js",
        "@arcgis/core/layers/FeatureLayer.js",
        "@arcgis/core/layers/GraphicsLayer.js",
        "@arcgis/core/Graphic.js"
    ]);
    const getTianditu = await $arcgis.import("https://openlayers.vip/examples/resources/tianditu.js");

    const vecLayers = getTianditu.default({ type: "vec_w" });
    const map = new Map({ basemap: { baseLayers: [vecLayers.base, vecLayers.anno] } });

    const view = new SceneView({
        container: "mapContainer", map: map,
        camera: {
            position: { longitude: 121.498, latitude: 31.205, z: 4000 },
            heading: 20, tilt: 60
        }
    });

    // ===== 监测点图层（客户端 FeatureLayer，唯一值着色） =====
    function buildMonitorLayer() {
        const cats = ["A类", "B类", "C类"];
        const colors = {
            "A类": [227, 74, 51],
            "B类": [56, 135, 220],
            "C类": [60, 180, 110]
        };
        const graphics = [];
        for (let i = 0; i < 80; i++) {
            const cat = cats[i % 3];
            graphics.push(new Graphic({
                geometry: {
                    type: "point",
                    x: 121.46 + Math.random() * 0.08,
                    y: 31.18 + Math.random() * 0.06,
                    z: 80 + Math.random() * 400,
                    spatialReference: { wkid: 4326 }
                },
                attributes: {
                    OBJECTID: i + 1,
                    NAME: "监测点" + (i + 1),
                    CATEGORY: cat
                }
            }));
        }
        return new FeatureLayer({
            source: graphics,
            objectIdField: "OBJECTID",
            fields: [
                { name: "OBJECTID", type: "oid" },
                { name: "NAME", type: "string" },
                { name: "CATEGORY", type: "string" }
            ],
            geometryType: "point",
            spatialReference: { wkid: 4326 },
            title: "实时监测点",
            elevationInfo: { mode: "relative-to-ground" },
            renderer: {
                type: "unique-value",
                field: "CATEGORY",
                uniqueValueInfos: cats.map(cat => ({
                    value: cat,
                    symbol: {
                        type: "point-3d",
                        symbolLayers: [{
                            type: "object",
                            resource: { primitive: "sphere" },
                            width: 220, height: 220, depth: 220,
                            material: { color: colors[cat] }
                        }]
                    }
                }))
            }
        });
    }

    // ===== 建筑体图层（GraphicsLayer，立方体） =====
    function buildBuildingLayer() {
        const layer = new GraphicsLayer({ title: "重点建筑体" });
        const bases = [
            { x: 121.490, y: 31.230, h: 900, c: [120, 170, 230] },
            { x: 121.495, y: 31.225, h: 1400, c: [230, 160, 70] },
            { x: 121.500, y: 31.220, h: 700, c: [120, 200, 160] },
            { x: 121.485, y: 31.218, h: 1100, c: [200, 120, 200] }
        ];
        bases.forEach((b, idx) => {
            layer.add(new Graphic({
                geometry: {
                    type: "point",
                    x: b.x, y: b.y, z: 0,
                    spatialReference: { wkid: 4326 }
                },
                symbol: {
                    type: "point-3d",
                    symbolLayers: [{
                        type: "object",
                        resource: { primitive: "cube" },
                        width: 350, depth: 350, height: b.h,
                        material: { color: b.c }
                    }]
                },
                attributes: { NAME: "建筑" + (idx + 1) }
            }));
        });
        return layer;
    }

    const monitorLayer = buildMonitorLayer();
    const buildingLayer = buildBuildingLayer();
    map.addMany([buildingLayer, monitorLayer]);

    // ===== 点击拾取（hitTest） =====
    let onlyMonitor = true;       // 是否仅拾取监测点图层
    let highlightHandle = null;   // 上一次高亮句柄

    function clearHighlight() {
        if (highlightHandle) {
            highlightHandle.remove();
            highlightHandle = null;
        }
    }

    view.on("click", async (event) => {
        // 独立使用时传入 event（含 x/y 屏幕坐标）；include 限定参与拾取的图层
        const hit = await view.hitTest(
            event,
            onlyMonitor ? { include: [monitorLayer] } : undefined
        );
        const results = (hit.results || []).filter(r => r.type === "graphic");
        document.getElementById("hitCount").textContent = results.length;

        clearHighlight();

        if (results.length === 0) {
            // 未命中要素时，取地面交点坐标
            const ground = (hit.results || []).find(r => r.type === "ground");
            document.getElementById("pickName").textContent = "未命中要素";
            document.getElementById("pickLayer").textContent = "—";
            document.getElementById("pickXY").textContent = ground
                ? ground.mapPoint.longitude.toFixed(4) + ", " + ground.mapPoint.latitude.toFixed(4)
                : "—";
            setStatus("点击位置无可选要素（命中 " + results.length + " 个图形）");
            return;
        }

        // 取最上层（results 已按渲染层级从顶到底排序）
        const top = results[0];
        const graphic = top.graphic;
        const layer = top.layer;
        const mapPoint = top.mapPoint;

        document.getElementById("pickName").textContent =
            graphic.attributes && graphic.attributes.NAME ? graphic.attributes.NAME : "要素";
        document.getElementById("pickLayer").textContent = layer ? layer.title : "—";
        document.getElementById("pickXY").textContent =
            mapPoint.longitude.toFixed(4) + ", " + mapPoint.latitude.toFixed(4);

        // 高亮被拾取的要素
        const lv = await view.whenLayerView(layer);
        highlightHandle = lv.highlight(graphic);

        setStatus("已拾取：" + (graphic.attributes && graphic.attributes.NAME || "要素") +
            "（共 " + results.length + " 个命中）");
    });

    await view.when();
    // 默认定位：自动框选数据范围，确保初始视角合适
    await monitorLayer.when();
    view.goTo(monitorLayer.fullExtent, { duration: 1500 }).catch(() => {});
    setStatus("hitTest 就绪 | 点击场景中的球体或建筑进行拾取");

    function setStatus(msg) { document.getElementById("statusText").textContent = msg; }

    // 切换「仅拾取监测点」
    document.getElementById("btnOnlyMonitor").addEventListener("click", function () {
        onlyMonitor = !onlyMonitor;
        this.classList.toggle("on", onlyMonitor);
        setStatus(onlyMonitor ? "仅拾取监测点图层" : "拾取全部图层要素");
    });
    // 清除高亮
    document.getElementById("btnClear").addEventListener("click", () => {
        clearHighlight();
        setStatus("已清除高亮");
    });
</script>
</body>
</html>
