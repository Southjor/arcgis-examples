<!DOCTYPE html>
<html lang="zh-CN">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>第8课：环境光照与阴影</title>
 <link rel="stylesheet" href="https://js.arcgis.com/5.0/esri/themes/light/main.css">
 <script type="module" src="https://js.arcgis.com/5.0/"></script>
 <style>
 * { margin: 0; padding: 0; box-sizing: border-box; }
 body { font-family: "Microsoft YaHei", sans-serif; }
 #mapContainer { width: 100vw; height: 100vh; }
 .page-title {
 position: absolute;
 top: 20px;
 left: 50%;
 transform: translateX(-50%);
 background: rgba(255,255,255,0.95);
 padding: 10px 24px;
 border-radius: 6px;
 font-size: 18px;
 font-weight: bold;
 z-index: 100;
 box-shadow: 0 2px 8px rgba(0,0,0,0.15);
 }
 .control-panel {
 position: absolute;
 top: 80px;
 right: 20px;
 background: rgba(255,255,255,0.95);
 padding: 16px;
 border-radius: 8px;
 box-shadow: 0 2px 12px rgba(0,0,0,0.15);
 z-index: 100;
 min-width: 240px;
 }
 .control-panel h3 {
 margin: 0 0 12px 0;
 font-size: 14px;
 color: #333;
 }
 .form-group {
 margin-bottom: 12px;
 }
 .form-group label {
 display: block;
 font-size: 12px;
 color: #666;
 margin-bottom: 4px;
 }
 .form-group input[type="range"] {
 width: 100%;
 }
 .form-group input[type="checkbox"] {
 margin-right: 6px;
 }
 .form-group input[type="datetime-local"] {
 width: 100%;
 padding: 4px;
 }
 .btn-row {
 display: flex;
 gap: 8px;
 margin-top: 12px;
 }
 .btn-row button {
 flex: 1;
 padding: 8px 0;
 border: 1px solid #d9d9d9;
 border-radius: 4px;
 background: white;
 cursor: pointer;
 font-size: 13px;
 }
 .btn-row button:hover {
 border-color: #1890ff;
 color: #1890ff;
 }
 .status-text {
 position: absolute;
 bottom: 20px;
 left: 50%;
 transform: translateX(-50%);
 background: rgba(0,0,0,0.7);
 color: white;
 padding: 8px 20px;
 border-radius: 20px;
 font-size: 13px;
 z-index: 100;
 pointer-events: none;
 }
 </style>
</head>
<body>
<h1 class="page-title">第8课：环境光照与阴影</h1>

<div class="control-panel">
 <h3>☀️ 光照控制</h3>
 <div class="form-group">
 <label>方位角（Azimuth）：<span id="valAzimuth">315°</span></label>
 <input type="range" id="sliderAzimuth" min="0" max="360" value="315">
 </div>
 <div class="form-group">
 <label>高度角（Altitude）：<span id="valAltitude">45°</span></label>
 <input type="range" id="sliderAltitude" min="0" max="90" value="45">
 </div>
 <div class="form-group">
 <label>日期时间驱动：</label>
 <input type="datetime-local" id="datetimePicker" style="width:100%;padding:4px;">
 </div>
 <h3 style="margin-top:16px;">🌑 阴影控制</h3>
 <div class="form-group">
 <label><input type="checkbox" id="chkDirectShadows" checked> 开启直接阴影（directShadowsEnabled）</label>
 </div>
 <div class="form-group">
 <label><input type="checkbox" id="chkCastShadows" checked> 图层投射阴影（castShadows）</label>
 </div>
 <div class="form-group">
 <label><input type="checkbox" id="chkReceiveShadows" checked> 图层接收阴影（receiveShadows）</label>
 </div>
 <div class="btn-row">
 <button id="btnResetLight">重置光照</button>
 <button id="btnToggleShadows">切换阴影</button>
 </div>
</div>

<div class="status-text" id="statusText">光照：方位角 315° / 高度角 45° | 阴影：开启</div>

<div id="mapContainer"></div>

<script type="module">
 const Map = await $arcgis.import("@arcgis/core/Map.js");
 const SceneView = await $arcgis.import("@arcgis/core/views/SceneView.js");
 const getTianditu = await $arcgis.import("https://openlayers.vip/examples/resources/tianditu.js");

 // 天地图底图
 const vecLayers = getTianditu.default({ type: "vec_w" });
 const map = new Map({
 basemap: { baseLayers: [vecLayers.base, vecLayers.anno] },
 ground: {
 surface: {
 elevationLayers: [{
 url: "https://www.geosceneonline.cn/image/rest/services/OpenData/ChinaTerrain3D/ImageServer/"
 }]
 }
 }
 });

 const view = new SceneView({
 container: "mapContainer",
 map: map,
 center: [116.39, 39.9], // 北京
 zoom: 12,
 tilt: 60
 });

 window.view = view;

 // ===== 等待视图就绪 =====
 view.when(() => {
 console.log("场景加载完成，开始配置光照和阴影...");
 initLighting();
 initShadows();
 updateStatus();
 });

 // ===== 初始化光照 =====
 function initLighting() {
 // 手动设置太阳位置（方位角 315° = 西南方向，高度角 45°）
 view.environment.lighting = {
 azimuth: 315, // 方位角（0-360°）
 altitude: 45 // 高度角（0-90°）
 };

 // 绑定滑块事件
 document.getElementById("sliderAzimuth").addEventListener("input", (e) => {
 const val = parseInt(e.target.value);
 view.environment.lighting.azimuth = val;
 document.getElementById("valAzimuth").textContent = val + "°";
 updateStatus();
 });

 document.getElementById("sliderAltitude").addEventListener("input", (e) => {
 const val = parseInt(e.target.value);
 view.environment.lighting.altitude = val;
 document.getElementById("valAltitude").textContent = val + "°";
 updateStatus();
 });

 // 日期时间选择器 → 自动计算太阳位置
 const datePicker = document.getElementById("datetimePicker");
 // 默认：今天下午 14:00
 const now = new Date();
 now.setHours(14, 0, 0, 0);
 datePicker.value = formatDateLocal(now);

 datePicker.addEventListener("change", (e) => {
 const selectedDate = new Date(e.target.value);
 // 使用日期驱动光照（自动计算太阳位置）
 view.environment.lighting = {
 date: selectedDate
 };
 updateStatus();
 });
 }

 // ===== 初始化阴影 =====
 function initShadows() {
 // 全局开启直接阴影
 view.environment.lighting.directShadowsEnabled = true;

 document.getElementById("chkDirectShadows").addEventListener("change", (e) => {
 view.environment.lighting.directShadowsEnabled = e.target.checked;
 updateStatus();
 });

 // 对所有 FeatureLayer 开启阴影
 view.map.allLayers.forEach((layer) => {
 if (layer.type === "feature") {
 layer.castShadows = true;
 layer.receiveShadows = true;
 }
 });

 document.getElementById("chkCastShadows").addEventListener("change", (e) => {
 view.map.allLayers.forEach((layer) => {
 if (layer.type === "feature") {
 layer.castShadows = e.target.checked;
 }
 });
 updateStatus();
 });

 document.getElementById("chkReceiveShadows").addEventListener("change", (e) => {
 view.map.allLayers.forEach((layer) => {
 if (layer.type === "feature") {
 layer.receiveShadows = e.target.checked;
 }
 });
 updateStatus();
 });
 }

 // ===== 按钮事件 =====
 document.getElementById("btnResetLight").addEventListener("click", () => {
 // 重置为默认光照（午后）
 view.environment.lighting = {
 azimuth: 315,
 altitude: 45
 };
 document.getElementById("sliderAzimuth").value = 315;
 document.getElementById("sliderAltitude").value = 45;
 document.getElementById("valAzimuth").textContent = "315°";
 document.getElementById("valAltitude").textContent = "45°";
 updateStatus();
 });

 document.getElementById("btnToggleShadows").addEventListener("click", () => {
 const current = view.environment.lighting.directShadowsEnabled;
 view.environment.lighting.directShadowsEnabled = !current;
 document.getElementById("chkDirectShadows").checked = !current;
 updateStatus();
 });

 // ===== 辅助函数 =====
 function formatDateLocal(date) {
 const y = date.getFullYear();
 const m = String(date.getMonth() + 1).padStart(2, "0");
 const d = String(date.getDate()).padStart(2, "0");
 const h = String(date.getHours()).padStart(2, "0");
 const min = String(date.getMinutes()).padStart(2, "0");
 return `${y}-${m}-${d}T${h}:${min}`;
 }

 function updateStatus() {
 const lighting = view.environment.lighting;
 const az = lighting.azimuth != null ? lighting.azimuth : "自动";
 const alt = lighting.altitude != null ? lighting.altitude : "自动";
 const shadowsOn = view.environment.lighting.directShadowsEnabled ? "开启" : "关闭";
 document.getElementById("statusText").textContent =
 `光照：方位角 ${az}° / 高度角 ${alt}° | 阴影：${shadowsOn}`;
 }
</script>
</body>
</html>
