<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>第36课：StreamLayer 实时流数据图层</title>
    <link rel="stylesheet" href="https://js.arcgis.com/5.0/esri/themes/light/main.css">
    <script type="module" src="https://js.arcgis.com/5.0/"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: "Microsoft YaHei", sans-serif; }
        #mapContainer { width: 100vw; height: 100vh; }
        .page-title {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(255,255,255,0.95); padding: 10px 24px; border-radius: 6px;
            font-size: 18px; font-weight: bold; z-index: 100;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }
        .control-panel {
            position: absolute; top: 80px; right: 20px;
            background: rgba(255,255,255,0.95); padding: 16px; border-radius: 8px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.15);
            z-index: 100; min-width: 260px;
        }
        .control-panel h3 { margin: 0 0 8px 0; font-size: 14px; color: #333; }
        .btn-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
        .btn-row button {
            flex: 1; min-width: 70px; padding: 6px 0;
            border: 1px solid #d9d9d9; border-radius: 4px;
            background: white; cursor: pointer; font-size: 12px;
        }
        .btn-row button:hover { border-color: #1890ff; color: #1890ff; }
        .btn-row button.on { background: #1890ff; color: white; border-color: #1890ff; }
        .info-card {
            margin-top: 10px; padding: 10px 12px;
            background: #f0f5ff; border-radius: 6px;
            border-left: 3px solid #1890ff; font-size: 12px; line-height: 1.8;
        }
        .info-card .val { font-weight: bold; color: #1890ff; }
        .status-text {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.7); color: white; padding: 8px 20px;
            border-radius: 20px; font-size: 13px; z-index: 100; pointer-events: none;
            white-space: nowrap;
        }
    </style>
</head>
<body>
<h1 class="page-title">第36课：StreamLayer 实时流数据图层</h1>

<div class="control-panel">
    <h3>🚌 实时车辆流（客户端模拟）</h3>
    <div class="btn-row">
        <button id="btnPlay" class="on">⏸️ 暂停推送</button>
        <button id="btnClear">🧹 清空轨迹</button>
    </div>
    <div class="btn-row">
        <button id="btnTrail" class="on">🛤️ 保留历史轨迹</button>
    </div>
    <div class="info-card">
        <div>推送状态：<span class="val" id="playState">运行中</span></div>
        <div>车辆数量：<span class="val" id="carCount">0</span></div>
        <div>累计消息：<span class="val" id="msgCount">0</span></div>
    </div>
</div>

<div class="status-text" id="statusText">StreamLayer | 客户端流式推送 3D 实时点位</div>

<div id="mapContainer"></div>

<script type="module">
    const [Map, SceneView, StreamLayer] = await $arcgis.import([
        "@arcgis/core/Map.js",
        "@arcgis/core/views/SceneView.js",
        "@arcgis/core/layers/StreamLayer.js"
    ]);
    const getTianditu = await $arcgis.import("https://openlayers.vip/examples/resources/tianditu.js");

    const vecLayers = getTianditu.default({ type: "vec_w" });
    const map = new Map({ basemap: { baseLayers: [vecLayers.base, vecLayers.anno] } });

    const view = new SceneView({
        container: "mapContainer", map: map,
        camera: {
            position: { longitude: 121.498, latitude: 31.225, z: 3500 },
            heading: 20, tilt: 60
        }
    });

    // ===== 客户端 StreamLayer（无需流服务，通过 sendMessageToClient 推送） =====
    const streamLayer = new StreamLayer({
        objectIdField: "OBJECTID",
        fields: [
            { name: "OBJECTID", alias: "OBJECTID", type: "oid" },
            { name: "TRACKID", alias: "轨迹编号", type: "long" },
            { name: "SPEED", alias: "速度", type: "double" }
        ],
        timeInfo: { trackIdField: "TRACKID" },  // 按轨迹编号归并同一车辆
        geometryType: "point",
        spatialReference: { wkid: 4326 },
        updateInterval: 100,
        purgeOptions: { displayCount: 2000 },
        elevationInfo: { mode: "relative-to-ground" },
        renderer: {
            type: "simple",
            symbol: {
                type: "point-3d",
                symbolLayers: [{
                    type: "object",
                    resource: { primitive: "sphere" },
                    width: 120, height: 120, depth: 120,
                    material: { color: [255, 90, 0, 0.9] }
                }]
            }
        }
    });
    map.add(streamLayer);

    // ===== 模拟数据：8 辆车沿各自方向匀速移动 =====
    const CAR_NUM = 8;
    const cars = [];
    for (let i = 0; i < CAR_NUM; i++) {
        cars.push({
            id: i + 1,
            lon: 121.47 + Math.random() * 0.06,
            lat: 31.20 + Math.random() * 0.05,
            z: 100 + Math.random() * 300,
            dLon: (Math.random() - 0.5) * 0.0006,
            dLat: (Math.random() - 0.5) * 0.0006
        });
    }

    let msgCount = 0;
    let playing = true;
    let timer = null;

    function pushFrame() {
        const features = cars.map(c => {
            c.lon += c.dLon;
            c.lat += c.dLat;
            // 越界折返，保证车辆始终在场景内
            if (c.lon < 121.46 || c.lon > 121.54) c.dLon *= -1;
            if (c.lat < 31.19 || c.lat > 31.26) c.dLat *= -1;
            return {
                geometry: { x: c.lon, y: c.lat, z: c.z, spatialReference: { wkid: 4326 } },
                attributes: { TRACKID: c.id, SPEED: Math.round(20 + Math.random() * 40) }
            };
        });
        // 官方客户端流式推送 API
        streamLayer.sendMessageToClient({ type: "features", features });
        msgCount += features.length;
        document.getElementById("carCount").textContent = CAR_NUM;
        document.getElementById("msgCount").textContent = msgCount;
    }

    function startTimer() { timer = setInterval(pushFrame, 500); }
    function stopTimer() { if (timer) { clearInterval(timer); timer = null; } }

    await view.when();
    startTimer();
    setStatus("StreamLayer 已连接 | 每 0.5 秒推送一帧位置");
    // 默认定位：框选车辆活动区域（车辆在此范围内移动）
    const region = {
        type: "extent",
        xmin: 121.45, xmax: 121.55,
        ymin: 31.18, ymax: 31.27,
        spatialReference: { wkid: 4326 }
    };
    view.goTo(region, { duration: 1500 }).catch(() => {});

    function setStatus(msg) { document.getElementById("statusText").textContent = msg; }

    // 播放 / 暂停
    document.getElementById("btnPlay").addEventListener("click", function () {
        playing = !playing;
        if (playing) { startTimer(); } else { stopTimer(); }
        this.classList.toggle("on", playing);
        this.textContent = playing ? "⏸️ 暂停推送" : "▶️ 继续推送";
        document.getElementById("playState").textContent = playing ? "运行中" : "已暂停";
        setStatus(playing ? "推送已恢复" : "推送已暂停");
    });

    // 清空轨迹（发送 clear 消息）
    document.getElementById("btnClear").addEventListener("click", () => {
        streamLayer.sendMessageToClient({ type: "clear" });
        msgCount = 0;
        document.getElementById("msgCount").textContent = 0;
        setStatus("轨迹已清空");
    });

    // 显示 / 隐藏轨迹线（trackInfo）
    let trailOn = true;
    document.getElementById("btnTrail").addEventListener("click", function () {
        trailOn = !trailOn;
        // 通过更新渲染是否包含线来控制；此处简化为切换图层的连线可见性
        view.whenLayerView(streamLayer).then((lv) => {
            lv.maximumNumberOfFeatures = trailOn ? 2000 : CAR_NUM;
        });
        this.classList.toggle("on", trailOn);
        setStatus(trailOn ? "显示历史轨迹点" : "仅显示最新位置");
    });
</script>
</body>
</html>
