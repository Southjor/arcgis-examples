<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>第42课：属性查询 Query</title>
    <link rel="stylesheet" href="https://js.arcgis.com/5.0/esri/themes/light/main.css">
    <script type="module" src="https://js.arcgis.com/5.0/"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: "Microsoft YaHei", sans-serif; }
        #mapContainer { width: 100vw; height: 100vh; }
        .page-title {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(255,255,255,0.95); padding: 10px 24px; border-radius: 6px;
            font-size: 18px; font-weight: bold; z-index: 100;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }
        .control-panel {
            position: absolute; top: 80px; right: 20px;
            background: rgba(255,255,255,0.95); padding: 16px; border-radius: 8px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.15);
            z-index: 100; min-width: 260px;
        }
        .control-panel h3 { margin: 0 0 8px 0; font-size: 14px; color: #333; }
        .btn-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
        .btn-row button {
            flex: 1; min-width: 70px; padding: 6px 0;
            border: 1px solid #d9d9d9; border-radius: 4px;
            background: white; cursor: pointer; font-size: 12px;
        }
        .btn-row button:hover { border-color: #1890ff; color: #1890ff; }
        .btn-row button.on { background: #1890ff; color: white; border-color: #1890ff; }
        .info-card {
            margin-top: 10px; padding: 10px 12px;
            background: #f0f5ff; border-radius: 6px;
            border-left: 3px solid #1890ff; font-size: 12px; line-height: 1.8;
            max-height: 180px; overflow: auto;
        }
        .info-card .val { font-weight: bold; color: #1890ff; }
        .status-text {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.7); color: white; padding: 8px 20px;
            border-radius: 20px; font-size: 13px; z-index: 100; pointer-events: none;
            white-space: nowrap;
        }
    </style>
</head>
<body>
<h1 class="page-title">第42课：属性查询 Query</h1>

<div class="control-panel">
    <h3>🔍 属性查询</h3>
    <div class="btn-row">
        <button data-status="故障">故障</button>
        <button data-status="预警">预警</button>
        <button data-status="正常">正常</button>
    </div>
    <div class="btn-row">
        <button id="btnAll">全部</button>
        <button id="btnClear">清除高亮</button>
    </div>
    <div class="btn-row">
        <button id="btnCount">📊 统计各状态数量</button>
    </div>
    <div class="info-card">
        <div>命中数量：<span class="val" id="resultCount">0</span></div>
        <div id="resultList"></div>
    </div>
</div>

<div class="status-text" id="statusText">Query | 按属性条件查询客户端要素</div>

<div id="mapContainer"></div>

<script type="module">
    const [Map, SceneView, FeatureLayer, Graphic] = await $arcgis.import([
        "@arcgis/core/Map.js",
        "@arcgis/core/views/SceneView.js",
        "@arcgis/core/layers/FeatureLayer.js",
        "@arcgis/core/Graphic.js"
    ]);
    const getTianditu = await $arcgis.import("https://openlayers.vip/examples/resources/tianditu.js");

    const vecLayers = getTianditu.default({ type: "vec_w" });
    const map = new Map({ basemap: { baseLayers: [vecLayers.base, vecLayers.anno] } });

    const view = new SceneView({
        container: "mapContainer", map: map,
        camera: {
            position: { longitude: 121.498, latitude: 31.205, z: 4000 },
            heading: 20, tilt: 60
        }
    });

    // ===== 客户端要素图层（带 STATUS 属性） =====
    const monitorLayer = (() => {
        const cats = ["A类", "B类", "C类"];
        const colors = {
            "A类": [227, 74, 51],
            "B类": [56, 135, 220],
            "C类": [60, 180, 110]
        };
        const statuses = ["正常", "预警", "故障"];
        const graphics = [];
        for (let i = 0; i < 90; i++) {
            graphics.push(new Graphic({
                geometry: {
                    type: "point",
                    x: 121.46 + Math.random() * 0.08,
                    y: 31.18 + Math.random() * 0.06,
                    z: 80 + Math.random() * 400,
                    spatialReference: { wkid: 4326 }
                },
                attributes: {
                    OBJECTID: i + 1,
                    NAME: "监测点" + (i + 1),
                    CATEGORY: cats[i % 3],
                    STATUS: statuses[Math.floor(Math.random() * 3)],
                    VALUE: (Math.random() * 100).toFixed(1)
                }
            }));
        }
        return new FeatureLayer({
            source: graphics,
            objectIdField: "OBJECTID",
            fields: [
                { name: "OBJECTID", type: "oid" },
                { name: "NAME", type: "string" },
                { name: "CATEGORY", type: "string" },
                { name: "STATUS", type: "string" },
                { name: "VALUE", type: "double" }
            ],
            geometryType: "point",
            spatialReference: { wkid: 4326 },
            title: "实时监测点",
            elevationInfo: { mode: "relative-to-ground" },
            renderer: {
                type: "unique-value",
                field: "CATEGORY",
                uniqueValueInfos: cats.map(cat => ({
                    value: cat,
                    symbol: {
                        type: "point-3d",
                        symbolLayers: [{
                            type: "object",
                            resource: { primitive: "sphere" },
                            width: 220, height: 220, depth: 220,
                            material: { color: colors[cat] }
                        }]
                    }
                }))
            }
        });
    })();
    map.add(monitorLayer);

    let highlightHandle = null;
    function clearHighlight() {
        if (highlightHandle) { highlightHandle.remove(); highlightHandle = null; }
    }

    // ===== 属性查询核心 =====
    async function queryByStatus(status) {
        clearHighlight();
        // 构造 Query：where 条件 + 返回字段 + 返回几何
        const query = monitorLayer.createQuery();
        query.where = "STATUS = '" + status + "'";
        query.outFields = ["NAME", "CATEGORY", "STATUS", "VALUE"];
        query.returnGeometry = true;
        query.orderByFields = ["VALUE DESC"];

        const result = await monitorLayer.queryFeatures(query);
        const features = result.features;

        document.getElementById("resultCount").textContent = features.length;
        document.getElementById("resultList").innerHTML = features
            .slice(0, 20)
            .map(f => "<div>· " + f.attributes.NAME + "（" + f.attributes.VALUE + "）</div>")
            .join("");

        // 高亮查询结果
        const lv = await view.whenLayerView(monitorLayer);
        highlightHandle = lv.highlight(features);

        setStatus("查询 STATUS='" + status + "' 命中 " + features.length + " 个");
    }

    async function queryAll() {
        clearHighlight();
        const result = await monitorLayer.queryFeatures({
            where: "1=1",
            outFields: ["NAME"],
            returnGeometry: false
        });
        document.getElementById("resultCount").textContent = result.features.length;
        document.getElementById("resultList").innerHTML =
            "共 " + result.features.length + " 个监测点";
        setStatus("查询全部命中 " + result.features.length + " 个");
    }

    // 统计各状态数量（queryFeatureCount）
    async function countByStatus() {
        const statuses = ["正常", "预警", "故障"];
        const parts = [];
        for (const s of statuses) {
            // queryFeatureCount 的参数是 QueryProperties 对象，不能传字符串
            const n = await monitorLayer.queryFeatureCount({ where: "STATUS = '" + s + "'" });
            parts.push(s + "：" + n);
        }
        document.getElementById("resultList").innerHTML =
            parts.map(p => "<div>" + p + "</div>").join("");
        document.getElementById("resultCount").textContent = "—";
        setStatus("统计完成 | " + parts.join("，"));
    }

    await view.when();
    await monitorLayer.when();
    view.goTo(monitorLayer.fullExtent, { duration: 1500 }).catch(() => {});
    setStatus("Query 就绪 | 点击状态按钮执行属性查询");

    function setStatus(msg) { document.getElementById("statusText").textContent = msg; }

    // 状态按钮
    document.querySelectorAll("[data-status]").forEach(btn => {
        btn.addEventListener("click", () => queryByStatus(btn.dataset.status));
    });
    document.getElementById("btnAll").addEventListener("click", queryAll);
    document.getElementById("btnCount").addEventListener("click", countByStatus);
    document.getElementById("btnClear").addEventListener("click", () => {
        clearHighlight();
        document.getElementById("resultCount").textContent = "0";
        document.getElementById("resultList").innerHTML = "";
        setStatus("已清除高亮");
    });
</script>
</body>
</html>
