<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>第28课：图层渲染顺序管理</title>
    <link rel="stylesheet" href="https://js.arcgis.com/5.0/esri/themes/light/main.css">
    <script type="module" src="https://js.arcgis.com/5.0/"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: "Microsoft YaHei", sans-serif; }
        #mapContainer { width: 100vw; height: 100vh; }
        .page-title {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(255,255,255,0.95); padding: 10px 24px; border-radius: 6px;
            font-size: 18px; font-weight: bold; z-index: 100;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }
        .control-panel {
            position: absolute; top: 80px; right: 20px;
            background: rgba(255,255,255,0.95); padding: 16px; border-radius: 8px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.15);
            z-index: 100; min-width: 320px;
        }
        .control-panel h3 { margin: 0 0 8px 0; font-size: 14px; color: #333; }
        .section { margin-bottom: 12px; padding-bottom: 10px; border-bottom: 1px solid #eee; }
        .section:last-child { border-bottom: none; margin-bottom: 0; }
        .btn-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
        .btn-row button {
            flex: 1; min-width: 70px; padding: 6px 0;
            border: 1px solid #d9d9d9; border-radius: 4px;
            background: white; cursor: pointer; font-size: 12px;
        }
        .btn-row button:hover { border-color: #1890ff; color: #1890ff; }
        .btn-row button.on { background: #1890ff; color: white; border-color: #1890ff; }
        .info-card {
            margin-top: 10px; padding: 10px 12px;
            background: #f0f5ff; border-radius: 6px;
            border-left: 3px solid #1890ff; font-size: 12px; line-height: 1.6;
        }
        .info-card .val { font-weight: bold; color: #1890ff; }
        .status-text {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.7); color: white; padding: 8px 20px;
            border-radius: 20px; font-size: 13px; z-index: 100; pointer-events: none;
            white-space: nowrap;
        }
    </style>
</head>
<body>
<h1 class="page-title">第28课：图层渲染顺序管理</h1>

<div class="control-panel">
    <div class="section">
        <h3>🔼 图层顺序（底部 → 顶部）</h3>
        <div class="btn-row">
            <button id="btnBldUp">🏢 建筑上移</button>
            <button id="btnBldDown">🏢 建筑下移</button>
        </div>
        <div class="btn-row">
            <button id="btnMkUp">🔵 标注上移</button>
            <button id="btnMkDown">🔵 标注下移</button>
        </div>
        <div class="btn-row">
            <button id="btnCtrUp">🟢 对照上移</button>
            <button id="btnCtrDown">🟢 对照下移</button>
        </div>
    </div>
    <div class="section">
        <h3>👁️ 列表显隐（listMode）</h3>
        <div class="btn-row">
            <button id="btnListMode" class="on">标注层显示在列表</button>
        </div>
    </div>
    <div class="info-card">
        <div>当前顺序（上→下）：</div>
        <div class="val" id="orderInfo">加载中...</div>
    </div>
</div>

<div class="status-text" id="statusText">图层渲染顺序管理 | map.reorder / listMode</div>

<div id="mapContainer"></div>

<script type="module">
    const Map = await $arcgis.import("@arcgis/core/Map.js");
    const SceneView = await $arcgis.import("@arcgis/core/views/SceneView.js");
    const FeatureLayer = await $arcgis.import("@arcgis/core/layers/FeatureLayer.js");
    const GraphicsLayer = await $arcgis.import("@arcgis/core/layers/GraphicsLayer.js");
    const Polygon = await $arcgis.import("@arcgis/core/geometry/Polygon.js");
    const SpatialReference = await $arcgis.import("@arcgis/core/geometry/SpatialReference.js");
    const projectOperator = await $arcgis.import("@arcgis/core/geometry/operators/projectOperator.js");
    const getTianditu = await $arcgis.import("https://openlayers.vip/examples/resources/tianditu.js");

    const vecLayers = getTianditu.default({ type: "vec_w" });
    const map = new Map({ basemap: { baseLayers: [vecLayers.base, vecLayers.anno] } });

    const view = new SceneView({
        container: "mapContainer", map: map,
        camera: {
            position: { longitude: 121.435, latitude: 31.245, z: 4000 },
            heading: 30, tilt: 60
        }
    });
    window.view = view;

    // 建筑图层
    const buildingsLayer = new FeatureLayer({
        url: "https://gs3d.geosceneonline.cn/server/rest/services/Hosted/ShangHaiBuilding/FeatureServer/0",
        title: "上海建筑",
        elevationInfo: { mode: "on-the-ground" },
        outFields: ["id", "floor"],
        renderer: {
            type: "simple",
            symbol: {
                type: "polygon-3d",
                symbolLayers: [{ type: "fill", material: { color: [212, 184, 124, 0.7] },
                    outline: { color: "#999999", size: 1 } }]
            }
        }
    });

    // 高亮标注图层（半透明多边形，贴地，覆盖建筑区域）
    const highlightLayer = new GraphicsLayer({ title: "标注层" });
    // 对照覆盖层（半透明绿色，与标注层完全重叠，用于直观演示 reorder 顺序）
    const contrastLayer = new GraphicsLayer({ title: "对照层" });

    // 三个平面层：建筑(底) → 标注(中) → 对照(顶)，绿色盖蓝色
    map.addMany([buildingsLayer, highlightLayer, contrastLayer]);

    // 按建筑范围动态生成标注/对照矩形，确保与建筑精确重叠
    async function addOverlayRects() {
        await projectOperator.load();
        const fe = buildingsLayer.fullExtent;                       // Web Mercator (102100)
        const polyMerc = new Polygon({
            rings: [[
                [fe.xmin, fe.ymin], [fe.xmax, fe.ymin], [fe.xmax, fe.ymax],
                [fe.xmin, fe.ymax], [fe.xmin, fe.ymin]
            ]],
            spatialReference: SpatialReference.WebMercator
        });
        const polyWgs = projectOperator.execute(polyMerc, SpatialReference.WGS84); // 转成经纬度

        const marker = {
            geometry: polyWgs,
            symbol: { type: "polygon-3d", symbolLayers: [{ type: "fill",
                material: { color: [24, 144, 255, 0.35] },
                outline: { color: [24, 144, 255, 1], size: 2 } }] }
        };
        const contrast = {
            geometry: polyWgs,
            symbol: { type: "polygon-3d", symbolLayers: [{ type: "fill",
                material: { color: [0, 200, 83, 0.45] },
                outline: { color: [0, 200, 83, 1], size: 2 } }] }
        };
        highlightLayer.add(marker);
        contrastLayer.add(contrast);
    }

    function refreshOrder() {
        const topToBottom = map.layers.toArray().reverse();
        document.getElementById("orderInfo").textContent = topToBottom.map(l => l.title).join("  →  ");
    }
    function setStatus(msg) { document.getElementById("statusText").textContent = msg; }

    view.when(async () => {
        await addOverlayRects();
        view.goTo(buildingsLayer.fullExtent, { duration: 2000, easing: "cubic-out" });
        refreshOrder();
    });

    function moveUp(layer, name) {
        const idx = map.layers.indexOf(layer);
        if (idx < map.layers.length - 1) {
            map.reorder(layer, idx + 1);
            refreshOrder();
            setStatus(name + " 上移一层");
        }
    }
    function moveDown(layer, name) {
        const idx = map.layers.indexOf(layer);
        if (idx > 0) {
            map.reorder(layer, idx - 1);
            refreshOrder();
            setStatus(name + " 下移一层");
        }
    }

    document.getElementById("btnBldUp").addEventListener("click", () => moveUp(buildingsLayer, "建筑"));
    document.getElementById("btnBldDown").addEventListener("click", () => moveDown(buildingsLayer, "建筑"));
    document.getElementById("btnMkUp").addEventListener("click", () => moveUp(highlightLayer, "标注"));
    document.getElementById("btnMkDown").addEventListener("click", () => moveDown(highlightLayer, "标注"));
    document.getElementById("btnCtrUp").addEventListener("click", () => moveUp(contrastLayer, "对照"));
    document.getElementById("btnCtrDown").addEventListener("click", () => moveDown(contrastLayer, "对照"));

    let listShown = true;
    document.getElementById("btnListMode").addEventListener("click", function () {
        listShown = !listShown;
        highlightLayer.listMode = listShown ? "show" : "hide";
        this.classList.toggle("on", listShown);
        this.textContent = listShown ? "标注层显示在列表" : "标注层隐藏于列表";
        setStatus("标注层 listMode = " + highlightLayer.listMode);
    });
</script>
</body>
</html>
