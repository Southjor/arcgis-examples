<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>第37课：客户端要素创建 FeatureLayer</title>
    <link rel="stylesheet" href="https://js.arcgis.com/5.0/esri/themes/light/main.css">
    <script type="module" src="https://js.arcgis.com/5.0/"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: "Microsoft YaHei", sans-serif; }
        #mapContainer { width: 100vw; height: 100vh; }
        .page-title {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(255,255,255,0.95); padding: 10px 24px; border-radius: 6px;
            font-size: 18px; font-weight: bold; z-index: 100;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }
        .control-panel {
            position: absolute; top: 80px; right: 20px;
            background: rgba(255,255,255,0.95); padding: 16px; border-radius: 8px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.15);
            z-index: 100; min-width: 260px;
        }
        .control-panel h3 { margin: 0 0 8px 0; font-size: 14px; color: #333; }
        .btn-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
        .btn-row button {
            flex: 1; min-width: 70px; padding: 6px 0;
            border: 1px solid #d9d9d9; border-radius: 4px;
            background: white; cursor: pointer; font-size: 12px;
        }
        .btn-row button:hover { border-color: #1890ff; color: #1890ff; }
        .btn-row button.on { background: #1890ff; color: white; border-color: #1890ff; }
        .info-card {
            margin-top: 10px; padding: 10px 12px;
            background: #f0f5ff; border-radius: 6px;
            border-left: 3px solid #1890ff; font-size: 12px; line-height: 1.8;
        }
        .info-card .val { font-weight: bold; color: #1890ff; }
        .status-text {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.7); color: white; padding: 8px 20px;
            border-radius: 20px; font-size: 13px; z-index: 100; pointer-events: none;
            white-space: nowrap;
        }
    </style>
</head>
<body>
<h1 class="page-title">第37课：客户端要素创建 FeatureLayer</h1>

<div class="control-panel">
    <h3>🏭 客户端设备图层（source）</h3>
    <div class="btn-row">
        <button id="btnAdd">➕ 新增设备</button>
        <button id="btnColor" class="on">🎨 按状态着色</button>
    </div>
    <div class="btn-row">
        <button id="btnGoto">🎯 定位图层</button>
    </div>
    <div class="info-card">
        <div>要素总数：<span class="val" id="count">0</span></div>
        <div>数据来源：<span class="val">纯客户端 source（无服务）</span></div>
    </div>
</div>

<div class="status-text" id="statusText">客户端 FeatureLayer | 用内存 Graphic 数组构建可查询图层</div>

<div id="mapContainer"></div>

<script type="module">
    const [Map, SceneView, FeatureLayer, Graphic] = await $arcgis.import([
        "@arcgis/core/Map.js",
        "@arcgis/core/views/SceneView.js",
        "@arcgis/core/layers/FeatureLayer.js",
        "@arcgis/core/Graphic.js"
    ]);
    const getTianditu = await $arcgis.import("https://openlayers.vip/examples/resources/tianditu.js");

    const vecLayers = getTianditu.default({ type: "vec_w" });
    const map = new Map({ basemap: { baseLayers: [vecLayers.base, vecLayers.anno] } });

    const view = new SceneView({
        container: "mapContainer", map: map,
        camera: {
            position: { longitude: 121.492, latitude: 31.215, z: 3000 },
            heading: 15, tilt: 60
        }
    });

    // ===== 构建客户端要素（Graphic 数组作为 source） =====
    const STATUS = ["正常", "预警", "故障"];
    let oid = 1;
    function makeFeature(lon, lat) {
        const id = oid++;   // 先取值再自增，保证 ObjectID 与 name 的编号一致
        return new Graphic({
            geometry: { type: "point", x: lon, y: lat, z: 80 + Math.random() * 200, spatialReference: { wkid: 4326 } },
            attributes: {
                ObjectID: id,
                name: "设备-" + String(id).padStart(3, "0"),
                status: STATUS[Math.floor(Math.random() * STATUS.length)],
                power: Math.round(50 + Math.random() * 450)
            }
        });
    }

    const graphics = [];
    for (let i = 0; i < 30; i++) {
        graphics.push(makeFeature(121.46 + Math.random() * 0.06, 31.19 + Math.random() * 0.05));
    }

    // 客户端 FeatureLayer：source + fields + objectIdField + geometryType
    const deviceLayer = new FeatureLayer({
        source: graphics,
        objectIdField: "ObjectID",
        geometryType: "point",
        spatialReference: { wkid: 4326 },
        hasZ: true,
        fields: [
            { name: "ObjectID", type: "oid" },
            { name: "name", alias: "名称", type: "string" },
            { name: "status", alias: "状态", type: "string" },
            { name: "power", alias: "功率", type: "double" }
        ],
        elevationInfo: { mode: "relative-to-ground" },
        outFields: ["*"],
        popupTemplate: {
            title: "{name}",
            content: "状态：{status}<br>功率：{power} kW"
        },
        renderer: buildRenderer(true)
    });
    map.add(deviceLayer);

    await view.when();
    await deviceLayer.when();
    updateCount();
    view.goTo(deviceLayer.fullExtent, { duration: 1500 }).catch(() => {});

    function setStatus(msg) { document.getElementById("statusText").textContent = msg; }
    async function updateCount() {
        const n = await deviceLayer.queryFeatureCount();
        document.getElementById("count").textContent = n;
    }

    // 按状态唯一值渲染 / 统一渲染
    function buildRenderer(byStatus) {
        const sym = (color) => ({
            type: "point-3d",
            symbolLayers: [{
                type: "object", resource: { primitive: "cylinder" },
                width: 200, height: 400, material: { color }
            }]
        });
        if (!byStatus) return { type: "simple", symbol: sym([0, 122, 255, 0.9]) };
        return {
            type: "unique-value",
            field: "status",
            uniqueValueInfos: [
                { value: "正常", symbol: sym([46, 204, 113, 0.9]) },
                { value: "预警", symbol: sym([241, 196, 15, 0.9]) },
                { value: "故障", symbol: sym([231, 76, 60, 0.95]) }
            ]
        };
    }

    // 新增设备（applyEdits 到客户端 source，需传入 Graphic）
    document.getElementById("btnAdd").addEventListener("click", async () => {
        const f = makeFeature(121.46 + Math.random() * 0.06, 31.19 + Math.random() * 0.05);
        await deviceLayer.applyEdits({ addFeatures: [f] });
        await updateCount();
        setStatus("已新增：" + f.attributes.name);
    });

    // 着色切换
    let byStatus = true;
    document.getElementById("btnColor").addEventListener("click", function () {
        byStatus = !byStatus;
        deviceLayer.renderer = buildRenderer(byStatus);
        this.classList.toggle("on", byStatus);
        setStatus(byStatus ? "按状态分色（正常/预警/故障）" : "统一蓝色渲染");
    });

    // 定位图层
    document.getElementById("btnGoto").addEventListener("click", () => {
        view.goTo(deviceLayer.fullExtent, { duration: 1200 }).catch(() => {});
        setStatus("已定位到设备图层范围");
    });
</script>
</body>
</html>
