<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>第17课：GraphicsLayer 图形图层</title>
    <link rel="stylesheet" href="https://js.arcgis.com/5.0/esri/themes/light/main.css">
    <script type="module" src="https://js.arcgis.com/5.0/"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: "Microsoft YaHei", sans-serif; }
        #mapContainer { width: 100vw; height: 100vh; }
        .page-title {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(255,255,255,0.95); padding: 10px 24px; border-radius: 6px;
            font-size: 18px; font-weight: bold; z-index: 100;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }
        .panel {
            position: absolute; top: 80px; right: 20px;
            background: rgba(255,255,255,0.95); padding: 16px; border-radius: 8px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.15);
            z-index: 100; min-width: 260px;
        }
        .panel h3 { margin: 0 0 8px 0; font-size: 14px; }
        .btn-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
        .btn-row button {
            flex: 1; padding: 6px 0;
            border: 1px solid #d9d9d9; border-radius: 4px;
            background: white; cursor: pointer; font-size: 12px;
        }
        .btn-row button:hover { border-color: #1890ff; color: #1890ff; }
        .status {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.7); color: white; padding: 8px 20px;
            border-radius: 20px; font-size: 13px; z-index: 100; pointer-events: none;
        }
    </style>
</head>
<body>
<h1 class="page-title">第17课：GraphicsLayer 图形图层</h1>

<div class="panel">
    <h3>📍 添加图形</h3>
    <div class="btn-row">
        <button id="btnPoint">🔴 加点</button>
        <button id="btnLine">📏 加线</button>
        <button id="btnPolygon">🔷 加面</button>
    </div>
    <div class="btn-row">
        <button id="btnMesh">📦 加立方体</button>
        <button id="btnCustomMesh">🔺 自定义Mesh</button>
    </div>
    <div class="btn-row">
        <button id="btnClear">🗑 清除</button>
    </div>
</div>

<div class="status" id="st">GraphicsLayer | 点击按钮添加图形</div>
<div id="mapContainer"></div>

<script type="module">
    const Map = await $arcgis.import("@arcgis/core/Map.js");
    const SceneView = await $arcgis.import("@arcgis/core/views/SceneView.js");
    const GraphicsLayer = await $arcgis.import("@arcgis/core/layers/GraphicsLayer.js");
    const Graphic = await $arcgis.import("@arcgis/core/Graphic.js");
    const Point = await $arcgis.import("@arcgis/core/geometry/Point.js");
    const Polyline = await $arcgis.import("@arcgis/core/geometry/Polyline.js");
    const Polygon = await $arcgis.import("@arcgis/core/geometry/Polygon.js");
    const Mesh = await $arcgis.import("@arcgis/core/geometry/Mesh.js");
    const ElevationLayer = await $arcgis.import("@arcgis/core/layers/ElevationLayer.js");
    const getTianditu = await $arcgis.import("https://openlayers.vip/examples/resources/tianditu.js");

    const tl = getTianditu.default({ type: "vec_w" });
    const map = new Map({
        basemap: { baseLayers: [tl.base, tl.anno] },
        ground: {
            surface: {
                elevationLayers: [new ElevationLayer({
                    url: "https://www.geosceneonline.cn/image/rest/services/OpenData/ChinaTerrain3D/ImageServer/"
                })]
            }
        }
    });

    const view = new SceneView({
        container: "mapContainer", map: map,
        camera: { position: { longitude: 116.397, latitude: 39.917, z: 800 }, heading: 30, tilt: 60 }
    });
    window.view = view;

    const gl = new GraphicsLayer({
        title: "图形层",
        elevationInfo: { mode: "relative-to-ground" },
        castShadows: true, receiveShadows: true
    });
    map.add(gl);

    function S(msg) { document.getElementById("st").textContent = msg; }
    const c = { lng: 116.397, lat: 39.917 };

    // 添加点
    document.getElementById("btnPoint").onclick = () => {
        const g = new Graphic({
            geometry: new Point({
                longitude: c.lng + 0.002 * Math.random(),
                latitude: c.lat + 0.002 * Math.random(),
                z: 150
            }),
            symbol: {
                type: "point-3d",
                symbolLayers: [{ type: "icon", resource: { primitive: "circle" }, size: 16, material: { color: [255, 50, 50] } }]
            }
        });
        gl.add(g);
        view.goTo(g.geometry);
        S("已添加红点（浮空 150m）");
    };

    // 添加线
    document.getElementById("btnLine").onclick = () => {
        const g = new Graphic({
            geometry: new Polyline({
                paths: [[[c.lng - 0.003, c.lat - 0.002], [c.lng + 0.001, c.lat + 0.001], [c.lng + 0.003, c.lat - 0.001]]]
            }),
            symbol: { type: "line-3d", symbolLayers: [{ type: "line", size: 4, material: { color: [255, 165, 0] } }] }
        });
        gl.add(g);
        view.goTo(g.geometry);
        S("已添加橙色线");
    };

    // 添加面
    document.getElementById("btnPolygon").onclick = () => {
        const g = new Graphic({
            geometry: new Polygon({
                rings: [[[c.lng - 0.002, c.lat - 0.001], [c.lng + 0.002, c.lat - 0.001], [c.lng + 0.001, c.lat + 0.002], [c.lng - 0.002, c.lat + 0.001]]]
            }),
            symbol: {
                type: "polygon-3d",
                symbolLayers: [{ type: "fill", material: { color: [0, 120, 255, 0.3] }, outline: { color: [0, 120, 255, 0.8] } }]
            }
        });
        gl.add(g);
        view.goTo(g.geometry);
        S("已添加蓝色面");
    };

    // 添加3D立方体
    document.getElementById("btnMesh").onclick = () => {
        const g = new Graphic({
            geometry: Mesh.createBox(new Point({ longitude: c.lng + 0.001, latitude: c.lat + 0.002, z: 0 }), { size: { width: 100, height: 150, depth: 100 } }),
            symbol: { type: "mesh-3d", symbolLayers: [{ type: "fill", material: { color: [0, 200, 100, 0.9] } }] }
        });
        gl.add(g);
        view.goTo(g.geometry);
        S("已添加绿色立方体");
    };

    // 添加自定义Mesh（四棱锥：顶点+索引构建）
    document.getElementById("btnCustomMesh").onclick = () => {
        const cx = c.lng, cy = c.lat, s = 0.0005; // ~55m
        const position = new Float64Array([
            cx,         cy + s * 0.8, 250,  // apex
            cx - s,     cy - s * 0.5, 100,  // base-left
            cx + s,     cy - s * 0.5, 100,  // base-right
            cx,         cy + s,       100   // base-front
        ]);
        const faces = new Uint32Array([
            0, 1, 2,  0, 2, 3,  0, 3, 1,  1, 3, 2
        ]);
        const g = new Graphic({
            geometry: new Mesh({
                vertexAttributes: { position: position },
                components: [{ faces: faces }],
                spatialReference: { wkid: 4326 }
            }),
            symbol: {
                type: "mesh-3d",
                symbolLayers: [{ type: "fill", material: { color: [255, 100, 50, 0.85] } }]
            }
        });
        gl.add(g);
        view.goTo(g.geometry);
        S("已添加自定义四棱锥 Mesh（顶点+索引构建）");
    };

    // 清除
    document.getElementById("btnClear").onclick = () => { gl.removeAll(); S("图形已清除"); };
</script>
</body>
</html>
