<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>第34课：VoxelIsosurface 等值面</title>
    <link rel="stylesheet" href="https://js.arcgis.com/5.0/esri/themes/light/main.css">
    <script type="module" src="https://js.arcgis.com/5.0/"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: "Microsoft YaHei", sans-serif; }
        #mapContainer { width: 100vw; height: 100vh; }
        .page-title {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(255,255,255,0.95); padding: 10px 24px; border-radius: 6px;
            font-size: 18px; font-weight: bold; z-index: 100;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }
        .control-panel {
            position: absolute; top: 80px; right: 20px;
            background: rgba(255,255,255,0.95); padding: 16px; border-radius: 8px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.15);
            z-index: 100; min-width: 320px;
        }
        .control-panel h3 { margin: 0 0 8px 0; font-size: 14px; color: #333; }
        .section { margin-bottom: 12px; padding-bottom: 10px; border-bottom: 1px solid #eee; }
        .section:last-child { border-bottom: none; margin-bottom: 0; }
        .btn-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
        .btn-row button {
            flex: 1; min-width: 60px; padding: 6px 0;
            border: 1px solid #d9d9d9; border-radius: 4px;
            background: white; cursor: pointer; font-size: 12px;
        }
        .btn-row button:hover { border-color: #1890ff; color: #1890ff; }
        .btn-row button.on { background: #1890ff; color: white; border-color: #1890ff; }
        .btn-row button:disabled { opacity: 0.5; cursor: not-allowed; }
        .slider-row { margin-top: 8px; font-size: 12px; color: #333; }
        .slider-row label { display: flex; justify-content: space-between; margin-bottom: 2px; }
        .slider-row .v { color: #1890ff; font-weight: bold; }
        .slider-row input[type=range] { width: 100%; }
        .color-row { margin-top: 8px; font-size: 12px; color: #333; display: flex; align-items: center; gap: 8px; }
        .color-row input[type=color] { width: 32px; height: 24px; border: none; background: none; cursor: pointer; }
        .info-card {
            margin-top: 10px; padding: 10px 12px;
            background: #f0f5ff; border-radius: 6px;
            border-left: 3px solid #1890ff; font-size: 12px; line-height: 1.6;
        }
        .info-card .val { font-weight: bold; color: #1890ff; }
        .status-text {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.7); color: white; padding: 8px 20px;
            border-radius: 20px; font-size: 13px; z-index: 100; pointer-events: none;
            white-space: nowrap;
        }
    </style>
</head>
<body>
<h1 class="page-title">第34课：VoxelIsosurface 等值面</h1>

<div class="control-panel">
    <div class="section">
        <h3>🟢 等值面（VoxelIsosurface）</h3>
        <div class="btn-row">
            <button id="btnAdd">添加等值面</button>
            <button id="btnRemove">移除最末</button>
        </div>
        <div style="font-size:11px;color:#888;margin-top:4px;">仅连续变量 + surfaces 模式，最多 4 个</div>
    </div>
    <div class="section">
        <h3>🎯 选中等值面</h3>
        <div class="btn-row">
            <button id="btnPrev">上一个</button>
            <button id="btnNext">下一个</button>
        </div>
    </div>
    <div class="section">
        <h3>⚙️ 等值面参数（选中项）</h3>
        <div class="slider-row">
            <label>数据值 value<span class="v" id="valVal">-</span></label>
            <input type="range" id="rngVal" min="0" max="100" value="50">
        </div>
        <div class="color-row">
            <span>颜色 color</span>
            <input type="color" id="clrPick" value="#6688f8">
            <button id="btnAutoColor" style="flex:0 0 auto;padding:4px 8px;">用取色器设色</button>
            <label style="display:flex;align-items:center;gap:4px;margin-left:auto;">
                <input type="checkbox" id="chkLocked" checked> colorLocked
            </label>
        </div>
    </div>
    <div class="section">
        <h3>🔧 图层开关</h3>
        <div class="btn-row">
            <button id="btnLegend" class="on">图例：开</button>
        </div>
    </div>
    <div class="info-card">
        <div>当前变量：<span class="val" id="varName">加载中...</span></div>
        <div>数据范围：<span class="val" id="range">-</span></div>
        <div>等值面数：<span class="val" id="count">0</span> / 4</div>
        <div>选中索引：<span class="val" id="activeIdx">-</span></div>
    </div>
</div>

<div class="status-text" id="statusText">VoxelIsosurface | 连续变量的特定值曲面</div>

<div id="mapContainer"></div>

<script type="module">
    const Map = await $arcgis.import("@arcgis/core/Map.js");
    const SceneView = await $arcgis.import("@arcgis/core/views/SceneView.js");
    const VoxelLayer = await $arcgis.import("@arcgis/core/layers/VoxelLayer.js");
    const VoxelIsosurface = await $arcgis.import("@arcgis/core/layers/voxel/VoxelIsosurface.js");
    const getTianditu = await $arcgis.import("https://openlayers.vip/examples/resources/tianditu.js");

    const vecLayers = getTianditu.default({ type: "vec_w" });
    const map = new Map({ basemap: { baseLayers: [vecLayers.base, vecLayers.anno] } });

    const view = new SceneView({
        container: "mapContainer", map: map,
        viewingMode: "local",
        camera: { position: { longitude: -70, latitude: 18, z: 800000 }, heading: 0, tilt: 60 }
    });
    window.view = view;

    const voxelLayer = new VoxelLayer({
        url: "https://gs3d.geosceneonline.cn/server/rest/services/Hosted/VoxelPM10/SceneServer"
    });
    map.add(voxelLayer);

    let variableStyle = null;  // VoxelVariableStyle
    let activeIndex = 0;       // 当前选中的等值面索引
    let rangeMin = 0, rangeMax = 100; // 当前连续变量的拉伸范围
    let seq = 0;               // 等值面序号

    view.when(() => {
        voxelLayer.when(() => {
            // 等值面只在 renderMode = "surfaces" 且 enableIsosurfaces = true 时绘制
            voxelLayer.renderMode = "surfaces";
            voxelLayer.enableIsosurfaces = true;

            // 变量样式：等值面集合位于 VoxelVariableStyle.isosurfaces
            variableStyle = voxelLayer.getVariableStyle(null);

            // 通过 transferFunction.stretchRange 获取变量数值范围
            const range = variableStyle.transferFunction.stretchRange;
            rangeMin = Math.min(range[0], range[1]);
            rangeMax = Math.max(range[0], range[1]);
            const mid = Math.floor((rangeMin + rangeMax) / 2);

            // 当前变量信息
            const varObj = voxelLayer.variables.getItemAt(voxelLayer.currentVariableId);
            document.getElementById("varName").textContent = varObj.name + "（" + varObj.unit + "）";
            document.getElementById("range").textContent = rangeMin + " ~ " + rangeMax;

            // 默认添加一条位于中间值的等值面
            addIsosurface(mid);

            view.goTo(voxelLayer.fullExtent, { duration: 2000 });
        }).catch(err => {
            document.getElementById("statusText").textContent = "加载失败";
            console.error(err);
        });
    });

    // 构造并添加等值面；value 取变量数值范围内的一个值
    function addIsosurface(value) {
        if (variableStyle.isosurfaces.length >= 4) {
            document.getElementById("statusText").textContent = "已达上限（4 个）";
            return;
        }
        const iso = new VoxelIsosurface({
            label: "Isosurface " + (++seq),
            enabled: true,
            value: value,
            color: [102, 136, 248],
            colorLocked: true
        });
        variableStyle.isosurfaces.add(iso);
        activeIndex = variableStyle.isosurfaces.length - 1;
        syncControlsToActive();
        updateInfo();
    }

    function updateInfo() {
        document.getElementById("count").textContent = variableStyle.isosurfaces.length;
        document.getElementById("activeIdx").textContent =
            variableStyle.isosurfaces.length ? activeIndex : "-";
        document.getElementById("btnAdd").disabled = variableStyle.isosurfaces.length >= 4;
    }

    // 将选中等值面的属性同步到控件显示
    function syncControlsToActive() {
        if (!variableStyle.isosurfaces.length) return;
        const iso = variableStyle.isosurfaces.getItemAt(activeIndex);
        const rng = document.getElementById("rngVal");
        rng.min = rangeMin; rng.max = rangeMax; rng.value = iso.value;
        document.getElementById("valVal").textContent = iso.value;
        const c = iso.color;
        if (Array.isArray(c)) {
            document.getElementById("clrPick").value =
                "#" + c.slice(0, 3).map(x => x.toString(16).padStart(2, "0")).join("");
        }
        document.getElementById("chkLocked").checked = iso.colorLocked;
        updateInfo();
    }

    document.getElementById("btnAdd").addEventListener("click", function () {
        const mid = Math.floor((rangeMin + rangeMax) / 2);
        addIsosurface(mid);
        document.getElementById("statusText").textContent = "已添加等值面";
    });

    document.getElementById("btnRemove").addEventListener("click", function () {
        const n = variableStyle.isosurfaces.length;
        if (n === 0) return;
        variableStyle.isosurfaces.removeAt(n - 1);   // 移除最末等值面
        if (activeIndex >= variableStyle.isosurfaces.length) {
            activeIndex = Math.max(0, variableStyle.isosurfaces.length - 1);
        }
        syncControlsToActive();
        document.getElementById("statusText").textContent = "已移除最末等值面";
    });

    document.getElementById("btnPrev").addEventListener("click", function () {
        if (variableStyle.isosurfaces.length === 0) return;
        activeIndex = (activeIndex - 1 + variableStyle.isosurfaces.length) % variableStyle.isosurfaces.length;
        syncControlsToActive();
    });

    document.getElementById("btnNext").addEventListener("click", function () {
        if (variableStyle.isosurfaces.length === 0) return;
        activeIndex = (activeIndex + 1) % variableStyle.isosurfaces.length;
        syncControlsToActive();
    });

    // 实时修改选中等值面的数据值
    document.getElementById("rngVal").addEventListener("input", function () {
        if (!variableStyle.isosurfaces.length) return;
        const iso = variableStyle.isosurfaces.getItemAt(activeIndex);
        iso.value = Number(this.value);
        document.getElementById("valVal").textContent = this.value;
    });

    // 修改颜色
    document.getElementById("clrPick").addEventListener("input", function () {
        if (!variableStyle.isosurfaces.length) return;
        const iso = variableStyle.isosurfaces.getItemAt(activeIndex);
        const hex = this.value; // #rrggbb
        const r = parseInt(hex.slice(1, 3), 16);
        const g = parseInt(hex.slice(3, 5), 16);
        const b = parseInt(hex.slice(5, 7), 16);
        iso.color = [r, g, b];
    });

    // 用 getColorForContinuousDataValue 取色并应用到选中等值面
    document.getElementById("btnAutoColor").addEventListener("click", function () {
        if (!variableStyle.isosurfaces.length) return;
        const cur = variableStyle.isosurfaces.getItemAt(activeIndex);
        const c = voxelLayer.getColorForContinuousDataValue(
            voxelLayer.currentVariableId, cur.value, false
        );
        if (c) {
            cur.color = [c.r, c.g, c.b, c.a];
            document.getElementById("clrPick").value =
                "#" + [c.r, c.g, c.b].map(x => x.toString(16).padStart(2, "0")).join("");
            document.getElementById("statusText").textContent = "已用取色器设色";
        }
    });

    // 切换 colorLocked
    document.getElementById("chkLocked").addEventListener("change", function () {
        if (!variableStyle.isosurfaces.length) return;
        const iso = variableStyle.isosurfaces.getItemAt(activeIndex);
        iso.colorLocked = this.checked;
        document.getElementById("statusText").textContent = "colorLocked = " + this.checked;
    });

    // 图例开关
    document.getElementById("btnLegend").addEventListener("click", function () {
        voxelLayer.legendEnabled = !voxelLayer.legendEnabled;
        this.classList.toggle("on", voxelLayer.legendEnabled);
        this.textContent = voxelLayer.legendEnabled ? "图例：开" : "图例：关";
    });
</script>
</body>
</html>
