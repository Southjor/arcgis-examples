<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>第19课：3D Tiles 图层</title>
    <link rel="stylesheet" href="https://js.arcgis.com/5.0/esri/themes/light/main.css">
    <script type="module" src="https://js.arcgis.com/5.0/"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: "Microsoft YaHei", sans-serif; }
        #mapContainer { width: 100vw; height: 100vh; }
        .page-title {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(255,255,255,0.95); padding: 10px 24px; border-radius: 6px;
            font-size: 18px; font-weight: bold; z-index: 100;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }
        .status {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.7); color: white; padding: 8px 20px;
            border-radius: 20px; font-size: 13px; z-index: 100; pointer-events: none;
        }
    </style>
</head>
<body>
<h1 class="page-title">第19课：3D Tiles 图层</h1>
<div class="status" id="st">3D Tiles | 加载中...</div>
<div id="mapContainer"></div>

<script type="module">
    const Map = await $arcgis.import("@arcgis/core/Map.js");
    const SceneView = await $arcgis.import("@arcgis/core/views/SceneView.js");
    // 关键：ArcGIS JS 原生支持 Cesium 3D Tiles（自 4.29 起），url 直接指向 tileset.json
    const IntegratedMesh3DTilesLayer = await $arcgis.import("@arcgis/core/layers/IntegratedMesh3DTilesLayer.js");
    const getTianditu = await $arcgis.import("https://openlayers.vip/examples/resources/tianditu.js");

    const tl = getTianditu.default({ type: "vec_w" });
    const map = new Map({ basemap: { baseLayers: [tl.base, tl.anno] } });

    const view = new SceneView({
        container: "mapContainer",
        map,
        // 初始视角给一个香港附近的大致位置，加载完成后会 goTo 到图层真实范围
        center: [114.17, 22.30],
        zoom: 11
    });
    window.view = view;

    // 3D Tiles (Cesium 3D Tiles 1.1, 香港集成网格) —— 直接指向 tileset.json
    const tiles = new IntegratedMesh3DTilesLayer({
        url: "http://openlayers.vip/cesium/3dtile/xianggang_1.1/tileset.json",
        title: "香港 3D Tiles 集成网格"
    });
    map.add(tiles);

    await view.when();
    // 等待图层资源加载完成，fullExtent 才会是图层的真实范围
    await tiles.load();
    try {
        view.goTo(tiles.fullExtent, { duration: 2000, easing: "cubic-out" });
        document.getElementById("st").textContent = "3D Tiles | 已加载：" + tiles.title;
    } catch (e) {
        document.getElementById("st").textContent = "3D Tiles | 加载失败：" + (e && e.message ? e.message : e);
        console.error(e);
    }
</script>
</body>
</html>
