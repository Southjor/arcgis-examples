<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>第24课：VectorTileLayer 矢量切片图层</title>
    <link rel="stylesheet" href="https://js.arcgis.com/5.0/esri/themes/light/main.css">
    <script type="module" src="https://js.arcgis.com/5.0/"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: "Microsoft YaHei", sans-serif; }
        #mapContainer { width: 100vw; height: 100vh; }
        .page-title {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(255,255,255,0.95); padding: 10px 24px; border-radius: 6px;
            font-size: 18px; font-weight: bold; z-index: 100;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }
        .control-panel {
            position: absolute; top: 80px; right: 20px;
            background: rgba(255,255,255,0.95); padding: 16px; border-radius: 8px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.15);
            z-index: 100; min-width: 300px;
        }
        .control-panel h3 { margin: 0 0 8px 0; font-size: 14px; color: #333; }
        .section { margin-bottom: 12px; padding-bottom: 10px; border-bottom: 1px solid #eee; }
        .section:last-child { border-bottom: none; margin-bottom: 0; }
        .btn-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
        .btn-row button {
            flex: 1; min-width: 60px; padding: 6px 0;
            border: 1px solid #d9d9d9; border-radius: 4px;
            background: white; cursor: pointer; font-size: 12px;
        }
        .btn-row button:hover { border-color: #1890ff; color: #1890ff; }
        .btn-row button.on { background: #1890ff; color: white; border-color: #1890ff; }
        .info-card {
            margin-top: 10px; padding: 10px 12px;
            background: #f0f5ff; border-radius: 6px;
            border-left: 3px solid #1890ff; font-size: 12px; line-height: 1.6;
        }
        .info-card .val { font-weight: bold; color: #1890ff; }
        .status-text {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.7); color: white; padding: 8px 20px;
            border-radius: 20px; font-size: 13px; z-index: 100; pointer-events: none;
            white-space: nowrap;
        }
    </style>
</head>
<body>
<h1 class="page-title">第24课：VectorTileLayer 矢量切片图层</h1>

<div class="control-panel">
    <div class="section">
        <h3>🗺️ 矢量切片图层（3D 贴合地面）</h3>
        <div class="btn-row">
            <button id="btnVisible" class="on">👁️ 显示 / 隐藏</button>
            <button id="btnOpacity">🌗 透明度</button>
        </div>
        <div class="btn-row">
            <button id="btnStyleA">🎨 切换暗色样式</button>
            <button id="btnStyleReset">↩️ 还原样式</button>
        </div>
    </div>
    <div class="info-card">
        <div>图层状态：<span class="val" id="layerStatus">加载中...</span></div>
        <div>3D 中 VTL 自动贴合地形</div>
    </div>
</div>

<div class="status-text" id="statusText">VectorTileLayer | 矢量切片 · 3D 贴合地面 · 支持样式切换</div>

<div id="mapContainer"></div>

<script type="module">
    const Map = await $arcgis.import("@arcgis/core/Map.js");
    const SceneView = await $arcgis.import("@arcgis/core/views/SceneView.js");
    const VectorTileLayer = await $arcgis.import("@arcgis/core/layers/VectorTileLayer.js");
    const getTianditu = await $arcgis.import("https://openlayers.vip/examples/resources/tianditu.js");

    const vecLayers = getTianditu.default({ type: "vec_w" });
    const map = new Map({ basemap: { baseLayers: [vecLayers.base, vecLayers.anno] } });

    const view = new SceneView({
        container: "mapContainer", map: map,
        camera: {
            position: { longitude: -118.24, latitude: 34.05, z: 12000 },
            heading: 0, tilt: 60
        }
    });
    window.view = view;

    // ===== VectorTileLayer：通过 portalItem 加载矢量切片 =====
    const vtl = new VectorTileLayer({
        portalItem: { id: "7675d44bb1e4428aa2c30a9b68f97822" }
    });
    map.add(vtl);

    let originalStyleUrl = null;   // 原始样式 URL（与瓦片同源，sprite/glyphs 配套）
    let originalStyle = null;      // 原始样式对象（用于派生暗色样式）
    let darkStyle = null;          // 缓存的暗色样式对象，避免重复构建

    view.when(() => {
        vtl.when(() => {
            const info = vtl.currentStyleInfo;
            originalStyleUrl = info && info.styleUrl;
            // 优先使用已解析的样式对象；否则按 URL 拉取与瓦片同源的样式 JSON。
            // 暗色样式必须基于「同源样式」派生，才能保留配套的 sprite/glyphs，
            // 否则加载外部不兼容样式会导致 3D 图标层 sprite 缺失，_drawIcons 读 size 崩溃。
            if (info && info.style) {
                originalStyle = info.style;
            } else if (originalStyleUrl) {
                fetch(originalStyleUrl)
                    .then(r => r.json())
                    .then(s => { originalStyle = s; })
                    .catch(err => console.warn("样式 JSON 拉取失败:", err.message));
            }
            document.getElementById("layerStatus").textContent = "已加载";
        }).catch(err => {
            document.getElementById("layerStatus").textContent = "加载失败";
            console.error(err);
        });
    });

    // 由同源样式派生暗色样式：仅改写 paint / 背景颜色，原样保留 sources、sprite、glyphs 引用，
    // 确保 3D 图标渲染仍能定位图集（不崩溃）。
    function buildDarkStyle(base) {
        const style = JSON.parse(JSON.stringify(base));
        if (style.background) style.background = "#1a1f29";
        (style.layers || []).forEach(layer => {
            const paint = layer.paint || (layer.paint = {});
            if (layer.type === "background") {
                paint["background-color"] = "#1a1f29";
            } else if (layer.type === "fill") {
                if (paint["fill-color"] !== undefined) paint["fill-color"] = "#232b36";
                if (paint["fill-outline-color"] !== undefined) paint["fill-outline-color"] = "#10151c";
            } else if (layer.type === "line") {
                if (paint["line-color"] !== undefined) paint["line-color"] = "#3a4756";
            } else if (layer.type === "symbol") {
                if (paint["text-color"] !== undefined) paint["text-color"] = "#d6dee8";
                if (paint["text-halo-color"] !== undefined) paint["text-halo-color"] = "#05080c";
            }
        });
        return style;
    }

    function setStatus(msg) { document.getElementById("statusText").textContent = msg; }

    // 显示 / 隐藏
    document.getElementById("btnVisible").addEventListener("click", function () {
        vtl.visible = !vtl.visible;
        this.classList.toggle("on", vtl.visible);
        setStatus("图层：" + (vtl.visible ? "显示" : "隐藏"));
    });

    // 透明度
    document.getElementById("btnOpacity").addEventListener("click", () => {
        vtl.opacity = vtl.opacity === 1 ? 0.5 : 1;
        setStatus("透明度：" + vtl.opacity);
    });

    // 切换暗色样式（基于当前同源样式派生，sprite/glyphs 与瓦片一致，不再崩溃）
    document.getElementById("btnStyleA").addEventListener("click", () => {
        if (!originalStyle) { setStatus("样式尚未就绪，请稍候再切换"); return; }
        if (!darkStyle) darkStyle = buildDarkStyle(originalStyle);
        vtl.loadStyle(darkStyle)
            .then(() => setStatus("已切换为：暗色样式"))
            .catch(err => setStatus("样式切换失败：" + err.message));
    });

    // 还原初始样式（直接恢复原始样式 URL，等价于最初加载的同源样式）
    document.getElementById("btnStyleReset").addEventListener("click", () => {
        if (!originalStyleUrl) { setStatus("样式尚未就绪，请稍候再还原"); return; }
        vtl.loadStyle(originalStyleUrl)
            .then(() => { darkStyle = null; setStatus("已还原初始样式"); })
            .catch(err => setStatus("样式还原失败：" + err.message));
    });
</script>
</body>
</html>
