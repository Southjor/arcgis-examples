<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>第51课：Symbol 专题 - 点符号 SimpleMarkerSymbol</title>
    <link rel="stylesheet" href="https://js.arcgis.com/5.0/esri/themes/light/main.css">
    <script type="module" src="https://js.arcgis.com/5.0/"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: "Microsoft YaHei", sans-serif; }
        #mapContainer { width: 100vw; height: 100vh; }
        .page-title {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(255,255,255,0.95); padding: 10px 24px; border-radius: 6px;
            font-size: 18px; font-weight: bold; z-index: 100;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }
        .panel {
            position: absolute; top: 80px; right: 20px; width: 300px;
            background: rgba(255,255,255,0.95); padding: 16px; border-radius: 8px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.15); z-index: 100;
        }
        .panel h3 { margin: 0 0 10px 0; font-size: 14px; }
        .form-group { margin-bottom: 10px; }
        .form-group label { display: block; font-size: 12px; margin-bottom: 4px; color: #555; }
        .form-group select,
        .form-group input[type="range"] { width: 100%; }
        .form-group input[type="color"] { width: 100%; height: 30px; border: 1px solid #d9d9d9; }
        .val { float: right; color: #1890ff; font-weight: bold; }
        .btn-row { display: flex; gap: 8px; margin-top: 10px; }
        .btn-row button {
            flex: 1; padding: 6px 0; font-size: 12px;
            border: 1px solid #d9d9d9; border-radius: 4px;
            background: white; cursor: pointer;
        }
        .btn-row button:hover { border-color: #1890ff; color: #1890ff; }
        .tip {
            margin-top: 10px; padding: 8px; font-size: 11px; line-height: 1.6;
            background: #fff7e6; border-left: 3px solid #faad14; border-radius: 3px; color: #614700;
        }
        .status {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.7); color: white; padding: 8px 20px;
            border-radius: 20px; font-size: 13px; z-index: 100; pointer-events: none;
        }
    </style>
</head>
<body>
<h1 class="page-title">第51课：Symbol 专题 - 点符号 SimpleMarkerSymbol</h1>

<div class="panel">
    <h3>🔴 点符号参数</h3>

    <div class="form-group">
        <label>形状 style</label>
        <select id="selStyle">
            <option value="circle">circle 圆</option>
            <option value="square">square 方</option>
            <option value="diamond">diamond 菱形</option>
            <option value="triangle">triangle 三角</option>
            <option value="cross">cross 十字</option>
            <option value="x">x 叉号</option>
        </select>
    </div>

    <div class="form-group">
        <label>大小 size<span class="val" id="vSize">12</span></label>
        <input type="range" id="rngSize" min="4" max="40" step="1" value="12">
    </div>

    <div class="form-group">
        <label>填充色 color</label>
        <input type="color" id="clrColor" value="#e74a33">
    </div>

    <div class="form-group">
        <label>描边宽度 outline.width<span class="val" id="vOutline">2</span></label>
        <input type="range" id="rngOutline" min="0" max="6" step="0.5" value="2">
    </div>

    <div class="btn-row">
        <button id="btnToggle3D">切换为 PointSymbol3D</button>
    </div>

    <div class="tip">
        💡 2D 点符号在三维中以 <b>billboard</b>（始终面向相机的贴片）方式渲染，没有体积。
        官方建议三维场景优先用 <b>PointSymbol3D</b>。
    </div>
</div>

<div class="status" id="st">点符号 | 调整参数观察三维场景中的变化</div>
<div id="mapContainer"></div>

<script type="module">
    const Map = await $arcgis.import("@arcgis/core/Map.js");
    const SceneView = await $arcgis.import("@arcgis/core/views/SceneView.js");
    const GraphicsLayer = await $arcgis.import("@arcgis/core/layers/GraphicsLayer.js");
    const Graphic = await $arcgis.import("@arcgis/core/Graphic.js");
    const Point = await $arcgis.import("@arcgis/core/geometry/Point.js");
    const SimpleMarkerSymbol = await $arcgis.import("@arcgis/core/symbols/SimpleMarkerSymbol.js");
    const ElevationLayer = await $arcgis.import("@arcgis/core/layers/ElevationLayer.js");
    const getTianditu = await $arcgis.import("https://openlayers.vip/examples/resources/tianditu.js");

    const tl = getTianditu.default({ type: "vec_w" });
    const map = new Map({
        basemap: { baseLayers: [tl.base, tl.anno] },
        ground: {
            surface: {
                elevationLayers: [new ElevationLayer({
                    url: "https://www.geosceneonline.cn/image/rest/services/OpenData/ChinaTerrain3D/ImageServer/"
                })]
            }
        }
    });

    const view = new SceneView({
        container: "mapContainer",
        map: map,
        camera: { position: { longitude: 121.473, latitude: 31.230, z: 900 }, heading: 0, tilt: 55 }
    });

    // relative-to-ground：点按 z 值悬浮于地面之上（三维特有的高度表达）
    const gl = new GraphicsLayer({ title: "标记点", elevationInfo: { mode: "relative-to-ground" } });
    map.add(gl);

    const stations = [
        { x: 121.4700, y: 31.2320, z: 0, name: "地面站" },
        { x: 121.4750, y: 31.2280, z: 150, name: "低空站" },
        { x: 121.4800, y: 31.2330, z: 300, name: "中空站" },
        { x: 121.4680, y: 31.2260, z: 450, name: "高空站" }
    ];

    // 当前符号参数
    const cfg = { style: "circle", size: 12, color: "#e74a33", outline: 2, use3D: false };

    function buildSymbol() {
        if (cfg.use3D) {
            // 三维原生符号：有体积、受光照
            return {
                type: "point-3d",
                symbolLayers: [{
                    type: "object",
                    resource: { primitive: "sphere" },
                    width: cfg.size * 12,
                    height: cfg.size * 12,
                    depth: cfg.size * 12,
                    material: { color: cfg.color }
                }]
            };
        }
        // 二维点符号：三维中以 billboard 贴片渲染
        return new SimpleMarkerSymbol({
            style: cfg.style,
            color: cfg.color,
            size: cfg.size,
            outline: { color: [255, 255, 255], width: cfg.outline }
        });
    }

    function rebuild() {
        const symbol = buildSymbol();
        gl.removeAll();
        stations.forEach((s, i) => {
            gl.add(new Graphic({
                geometry: new Point({ longitude: s.x, latitude: s.y, z: s.z, spatialReference: { wkid: 4326 } }),
                symbol: symbol,
                attributes: { OBJECTID: i + 1, NAME: s.name }
            }));
        });
        setStatus("已更新：" + (cfg.use3D ? "PointSymbol3D（有体积）" : "SimpleMarkerSymbol（billboard 贴片）"));
    }

    function setStatus(msg) { document.getElementById("st").textContent = msg; }

    // ===== 面板事件 =====
    document.getElementById("selStyle").onchange = (e) => {
        cfg.style = e.target.value;
        rebuild();
    };
    document.getElementById("rngSize").oninput = (e) => {
        cfg.size = Number(e.target.value);
        document.getElementById("vSize").textContent = cfg.size;
        rebuild();
    };
    document.getElementById("clrColor").oninput = (e) => {
        cfg.color = e.target.value;
        rebuild();
    };
    document.getElementById("rngOutline").oninput = (e) => {
        cfg.outline = Number(e.target.value);
        document.getElementById("vOutline").textContent = cfg.outline;
        rebuild();
    };
    document.getElementById("btnToggle3D").onclick = (e) => {
        cfg.use3D = !cfg.use3D;
        e.target.textContent = cfg.use3D ? "切换为 SimpleMarkerSymbol" : "切换为 PointSymbol3D";
        rebuild();
    };

    await view.when();
    rebuild();
    view.goTo(gl.graphics.toArray(), { duration: 1500 }).catch(() => {});
    setStatus("点符号示例就绪 | 4 个点分别位于 0 / 150 / 300 / 450 米高度");
</script>
</body>
</html>
